/* ---------- Chart pieces (single-series horizontal bars; one hue, labels in ink) ---------- */
.ds-bars { display: grid; gap: var(--t1m-space-3); }
.ds-bar-row { position: relative; display: grid; grid-template-columns: minmax(96px, 150px) minmax(0, 1fr) 64px; align-items: center; gap: var(--t1m-space-3); font-size: var(--t1m-text-sm); border-radius: var(--t1m-radius-sm); padding: 4px; margin: -4px; }
.ds-bar-row[data-href] { cursor: pointer; }
.ds-bar-row[data-href]:hover { background: var(--t1m-navy-50); }
.ds-bar-row__name { color: var(--t1m-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ds-bar-row__value { text-align: right; font-variant-numeric: tabular-nums; color: var(--t1m-ink-2); }
.ds-bar-row .ds-bar-track { height: 16px; border-radius: 0 var(--t1m-radius-sm) var(--t1m-radius-sm) 0; background: var(--t1m-surface-muted); }
.ds-bar-row .ds-bar-fill { border-radius: 0 4px 4px 0; animation: ds-bar-grow var(--t1m-dur-slow) var(--t1m-ease) backwards; transform-origin: left; }
.ds-bar-row[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 6px); translate: -50% 0; z-index: 10; padding: 6px 10px; border-radius: var(--t1m-radius-sm); background: var(--t1m-navy-950); color: var(--t1m-ink-inverse); font-size: var(--t1m-text-xs); white-space: nowrap; box-shadow: var(--t1m-shadow-float); pointer-events: none; }
@keyframes ds-bar-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.ds-bar-stack { position: absolute; inset: 0; display: flex; gap: 2px; }
.ds-bar-stack > span { height: 100%; animation: ds-bar-grow var(--t1m-dur-slow) var(--t1m-ease) backwards; transform-origin: left; }
.ds-chart-note { font-size: var(--t1m-text-xs); color: var(--t1m-ink-2); margin-top: var(--t1m-space-4); display: flex; gap: var(--t1m-space-2); }
.ds-chart-note .ds-icon { width: 14px; height: 14px; margin-top: 1px; color: var(--t1m-ink-3); }
.ds-legend { display: flex; gap: var(--t1m-space-4); flex-wrap: wrap; font-size: var(--t1m-text-xs); color: var(--t1m-ink-2); }
.ds-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
@media (max-width: 640px) { .ds-bar-row { grid-template-columns: minmax(80px, 110px) minmax(0, 1fr) 52px; gap: var(--t1m-space-2); } }
@media (prefers-reduced-motion: reduce) { .ds-bar-row .ds-bar-fill, .ds-bar-stack > span, .ds-clock .ds-bar-fill { animation: none; } }

/* ---------- Scenario launcher (demo guide) ---------- */
.ds-scenarios { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--t1m-space-2); }
.ds-scenario { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: var(--t1m-space-3); align-items: center; padding: var(--t1m-space-3); border-radius: var(--t1m-radius-md); border: 1px solid var(--t1m-border); }
.ds-scenario__n { width: 32px; height: 32px; border-radius: var(--t1m-radius-full); display: grid; place-items: center; background: var(--t1m-navy-50); color: var(--t1m-navy-700); font-weight: var(--t1m-w-label); }
.ds-scenario__title { font-weight: var(--t1m-w-control); color: var(--t1m-ink); }
.ds-scenario__who { font-size: var(--t1m-text-xs); color: var(--t1m-ink-2); }

/* ---------- Deal stepper (inquiry -> quotation -> client approval -> shipment job) ---------- */
.ds-deal { display: grid; gap: var(--t1m-space-4); }
.ds-deal__step { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: var(--t1m-space-4); position: relative; }
.ds-deal__step:not(:last-child)::before { content: ""; position: absolute; left: 15px; top: 40px; bottom: calc(var(--t1m-space-4) * -1); width: 2px; background: var(--t1m-border); }
.ds-deal__step[data-state="done"]:not(:last-child)::before { background: var(--t1m-navy-700); }
.ds-deal__n { width: 32px; height: 32px; margin-top: var(--t1m-space-3); border-radius: var(--t1m-radius-full); display: grid; place-items: center; background: var(--t1m-surface); box-shadow: inset 0 0 0 2px var(--t1m-border-strong); color: var(--t1m-ink-3); font-weight: var(--t1m-w-label); position: relative; z-index: 1; }
.ds-deal__n .ds-icon { width: 16px; height: 16px; stroke-width: 2.25; }
.ds-deal__step[data-state="done"] .ds-deal__n { background: var(--t1m-navy-700); box-shadow: none; color: var(--t1m-ink-inverse); }
.ds-deal__step[data-state="current"] .ds-deal__n { box-shadow: inset 0 0 0 2px var(--t1m-navy-700), 0 0 0 4px var(--t1m-navy-100); color: var(--t1m-navy-700); background: var(--t1m-surface); }
.ds-deal__step[data-state="todo"] > .ds-panel { background: transparent; box-shadow: none; border: 1px dashed var(--t1m-border-strong); }
@media (max-width: 640px) { .ds-deal__step { grid-template-columns: minmax(0, 1fr); } .ds-deal__n, .ds-deal__step::before { display: none; } }

/* ---------- Read-only marker (Finance and anyone viewing what they cannot change) ---------- */
.ds-readonly { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t1m-text-xs); color: var(--t1m-ink-2); background: var(--t1m-surface-muted); border-radius: var(--t1m-radius-full); padding: 2px 10px; }
.ds-readonly .ds-icon { width: 12px; height: 12px; }

/* ---------- v3 responsive refinements ---------- */
/* Phone cards: the first cell is the card's title (ID + name), full width and left aligned, with
   no label; every other cell keeps its label and may wrap instead of being clipped. */
@media (max-width: 640px) {
  .ds-table--stack td { white-space: normal; min-width: 0 !important; }
  .ds-table--stack td:first-child { display: block; text-align: left; padding-bottom: var(--t1m-space-2); }
  .ds-table--stack td:first-child::before { display: none; }
  .ds-table--stack td > * { max-width: 70%; }
  .ds-table--stack td:first-child > * { max-width: none; }
  .ds-table--stack td[data-label=""]::before { display: none; }
  .ds-table--stack td[data-label=""] { justify-content: flex-start; }
}
@media (max-width: 960px) { .ds-sidebar__foot { display: none; } }
.ds-table td.ds-col-main { white-space: normal; min-width: 200px; }

</style>

/* ============================== MOCK DATA ==============================
   Everything here is fictional. The portal's clock is frozen at Monday 28 Sep 2026 so that
   "overdue", "days left" and fee clocks read the same in every demo. */
const TODAY = new Date(2026, 8, 28);

/* Dates are stored as "28 Sep 2026" strings, the way staff write them. */
const MONTHS = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function parseDMY(str){
  const m = str && String(str).match(/(\d{1,2}) (\w{3}) (\d{4})/);
  return m && MONTHS[m[2]]!=null ? new Date(+m[3], MONTHS[m[2]], +m[1]) : null;
}
// <input type="date"> speaks YYYY-MM-DD; the app stores "05 Oct 2026".
function dmyToISO(str){ const d = parseDMY(str); return d ? d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') : ''; }
function isoToDMY(iso){ const m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? m[3]+' '+Object.keys(MONTHS)[+m[2]-1]+' '+m[1] : ''; }
function daysUntil(str){ const d = parseDMY(str); return d ? Math.round((d - TODAY) / 86400000) : null; }
function todayDMY(){ return String(TODAY.getDate()).padStart(2,'0')+' '+Object.keys(MONTHS)[TODAY.getMonth()]+' '+TODAY.getFullYear(); }
function addDaysDMY(n){ const d = new Date(TODAY); d.setDate(d.getDate()+n); return String(d.getDate()).padStart(2,'0')+' '+Object.keys(MONTHS)[d.getMonth()]+' '+d.getFullYear(); }
function nowStamp(){ const d=new Date(); let h=d.getHours(); const ap=h>=12?'PM':'AM'; h=h%12||12; return todayDMY()+' '+h+':'+String(d.getMinutes()).padStart(2,'0')+' '+ap; }
function shortDate(str){ return String(str||'').replace(/ \d{4}$/,''); }

const FLAT_SEQUENCE = [];
STATUS_STEPS.forEach(phase=>{
  if(phase===CUSTOMS_PHASE) CUSTOMS_SUBSTAGES.forEach(sub=>FLAT_SEQUENCE.push({phase,sub}));
  else FLAT_SEQUENCE.push({phase,sub:null});
});
function flatIndexOf(phase, sub){ return FLAT_SEQUENCE.findIndex(f=>f.phase===phase && f.sub===(sub||null)); }
function jobFlatIndex(j){
  const phase = STATUS_STEPS[j.statusIndex];
  const sub = phase===CUSTOMS_PHASE && j.customs ? CUSTOMS_SUBSTAGES[j.customs.subIndex] : null;
  return flatIndexOf(phase, sub);
}

const TASK_MILESTONES = [

  { name:'Lodge customs entry', evidence:true, atPhase:CUSTOMS_PHASE, atSub:'Lodging Pending' },
  { name:'Pay duties and assessment', evidence:true, atPhase:CUSTOMS_PHASE, atSub:'Payment Pending', money:true },
  { name:'Secure delivery order', evidence:false, atPhase:CUSTOMS_PHASE, atSub:'Release Pending' },
  { name:'Book delivery truck', evidence:false, atPhase:CUSTOMS_PHASE, atSub:'Released' },
  { name:'Deliver to consignee', evidence:true, crew:true, atPhase:'Out for Delivery', via:'delivery' },
  { name:'Return empty container', evidence:false, crew:true, atPhase:'Delivered', detention:true }
];
const DOC_TEMPLATE = ['Commercial Invoice','Packing List','Bill of Lading','Certificate of Origin','Import Permit'];

function defaultTasks(j){
  const jobFlat = jobFlatIndex(j);
  return TASK_MILESTONES.map((t,i)=>{
    const flat = flatIndexOf(t.atPhase, t.atSub||null);
    const done = jobFlat > flat;
    const owner = t.crew ? crewFor(j) : coordinatorFor(j.customerId);
    return {
      id:'T'+(i+1), name:t.name, owner, flat,
      due: done ? null : (jobFlat===flat ? '30 Sep 2026' : '0'+(3+i)+' Oct 2026'),
      done, requiresEvidence:t.evidence, detention:!!t.detention, via:t.via||null, money:!!t.money,
      evidenceFile: done && t.evidence ? t.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-evidence.pdf' : null,
      note:null, doneBy: done ? owner : null, doneOn: done ? '2026-09-'+String(10+i).padStart(2,'0') : null
    };
  });
}
function defaultDocuments(statusIndex){
  return DOC_TEMPLATE.map((name,i)=>({
    id:'D'+(i+1), name, version: statusIndex>0 ? 1 : 0,
    status: statusIndex>1 ? 'Approved' : (statusIndex>0 ? 'Pending Review' : 'Missing'),
    rejectReason:null, file: statusIndex>0 ? name.toLowerCase().replace(/ /g,'-')+'-v1.pdf' : null
  }));
}
function job(o){
  const j = Object.assign({
    exceptions:[], delivery:{confirmed:false}, charges:[], fundsReceived:[],
    customs:null, priority:'Normal', importExportFlag:'Import',
    storageDeadline:null, detentionDeadline:null,
    auditLog:[{ ts:'—', actor:'System', action:'Job created', detail:'Converted from inquiry/quotation. No re-keying.' }]
  }, o);
  if(!o.tasks) j.tasks = defaultTasks(j);
  if(!o.documents) j.documents = defaultDocuments(j.statusIndex);
  return j;
}

/* A believable dated history for every seed job, so the audit trail and its date filter have

(function seedHistory(){
  const CREATED = { '00095':18, '00088':16, '00082':12, '00077':10, '00130':14, '00070':5, '00065':13, '00120':14, '00060':2, '00050':-6, '00110':27 };
  const END = { '00060':22, '00050':15, '00070':25 };
  const day = n => n>0 ? (String(n).padStart(2,'0')+' Sep 2026') : (String(31+n).padStart(2,'0')+' Aug 2026');
  const times = ['9:05 AM','10:20 AM','11:45 AM','1:30 PM','2:15 PM','3:40 PM','4:10 PM','9:50 AM'];
  JOBS.forEach(j=>{
    const key = j.id.slice(-5), d0 = CREATED[key];
    if(d0!=null && j.auditLog.length===1 && j.auditLog[0].ts==='—'){
      const who = coordinatorFor(j.customerId)+' (Dispatcher)';
      const end = END[key] || 27;
      const log = [{ ts:day(d0)+' '+times[0], actor:who, action:'Job created', detail:'Converted from inquiry/quotation. No re-keying.' }];
      for(let k=1;k<=j.statusIndex;k++){
        const dd = Math.max(d0, Math.round(d0 + k*(end-d0)/Math.max(1,j.statusIndex)));
        const label = STATUS_STEPS[k];
        log.push(label==='Billing Ready'
          ? { ts:day(dd)+' '+times[k%8], actor:'Grace Tan (Manager)', action:'Ready for Finance', detail:'Billing checklist complete. Handed to Finance.' }
          : label==='Closed'
          ? { ts:day(dd)+' '+times[k%8], actor:'Grace Tan (Manager)', action:'Job closed', detail:'Finance confirmed the handoff.' }
          : { ts:day(dd)+' '+times[k%8], actor:who, action:'Stage changed', detail:'Moved to '+label+'.' });
      }
      j.auditLog = log;
    }

/* ---- src/10-rules.js ---- */
/* ============================== WHO IS SIGNED IN, AND WHAT THEY MAY DO ============================== */
let CURRENT_USER = null; // { name, role }
function role(){ return CURRENT_USER ? CURRENT_USER.role : null; }
function can(moduleName){
  if(!moduleName) return true;
  if(!CURRENT_USER) return false;
  const idx = MODULES.indexOf(moduleName);
  return !!(PERM[CURRENT_USER.role] && idx>-1 && PERM[CURRENT_USER.role][idx]);
}
function isManagerLike(){ return ['Manager','Admin'].includes(role()); }
function isFinance(){ return role()==='Finance'; }
function isCrew(){ return role()==='Warehouse Crew'; }
function isDispatcher(){ return role()==='Dispatcher'; }
function canSeeFunds(){ return can('Charges & Billing'); }
function canManageFunds(){ return isManagerLike(); }
function canMoveStage(){ return ['Dispatcher','Manager','Admin'].includes(role()); }
function canApproveDocs(){ return ['Dispatcher','Manager','Admin'].includes(role()); }
function canUploadDocs(){ return ['Dispatcher','Warehouse Crew','Manager','Admin'].includes(role()); }
function canApproveExceptions(){ return isManagerLike(); }
function canRaiseException(){ return ['Dispatcher','Warehouse Crew','Manager','Admin'].includes(role()); }
function canConfirmDelivery(){ return can('Delivery & POD'); }
function canCompleteTask(t){ return ['Dispatcher','Manager','Admin'].includes(role()) || (isCrew() && t.owner===CURRENT_USER.name); }
function canReassign(){ return ['Dispatcher','Manager','Admin'].includes(role()); }
function actorLabel(){ return CURRENT_USER ? CURRENT_USER.name+' ('+CURRENT_USER.role+')' : 'System'; }
function userByName(n){ return USERS.find(u=>u.name===n); }
function roleOf(name){ const u = userByName(name); return u ? u.role : ''; }

/* Row-level scope. Dispatchers coordinate their own customers' jobs (they can open any job, but
   Home and Reports focus on theirs); Warehouse Crew only ever see jobs they have tasks on. */
function canSeeJob(j){
  if(!CURRENT_USER) return false;
  if(isCrew()) return j.tasks.some(t=>t.owner===CURRENT_USER.name);
  return true;
}
function myJobs(){
  if(isDispatcher()) return JOBS.filter(j=>coordinatorFor(j.customerId)===CURRENT_USER.name);
  if(isCrew()) return JOBS.filter(canSeeJob);
  return JOBS;
}
function log(j, action, detail, finance){ j.auditLog.push({ ts:nowStamp(), actor:actorLabel(), action, detail, finance:!!finance }); }
function visibleAudit(j){ return j.auditLog.filter(a=>!a.finance || canSeeFunds()); }

/* ============================== TASKS ==============================
   A task's status is worked out, not typed in: Done when completed; Overdue when its due date has
   passed; To do when the job has reached the point where it belongs; Upcoming otherwise. */
const TASK_TONE = { 'Done':'success', 'To do':'info', 'Upcoming':'neutral', 'Overdue':'danger' };
const TASK_ICON = { 'Done':'check', 'To do':'clock', 'Upcoming':'circle', 'Overdue':'alert' };
function taskStatus(j, t){
  if(t.done) return 'Done';
  const d = parseDMY(t.due);
  if(d && d < TODAY) return 'Overdue';
  if(t.flat==null || jobFlatIndex(j) >= t.flat) return 'To do';
  return 'Upcoming';
}
function openTasks(j){ return j.tasks.filter(t=>!t.done); }
function taskByName(j, name){ return j.tasks.find(t=>t.name===name); }

/* ============================== DOCUMENTS ============================== */
const DOC_TONE = {'Missing':'warning','Pending Review':'info','Approved':'success','Rejected':'danger'};
const DOC_ICON = {'Missing':'alert','Pending Review':'eye','Approved':'check','Rejected':'x'};
const DOC_LABEL = {'Missing':'Missing','Pending Review':'To review','Approved':'Approved','Rejected':'Rejected'};
/* Before Documentation starts, an empty document is simply not due yet, not a problem. */
function docsDue(j){ return j.statusIndex>=1; }
function docProblem(j, d){ return d.status==='Rejected' || (d.status==='Missing' && docsDue(j)); }

/* ============================== EXCEPTIONS ============================== */
const EX_TONE = {'Pending Approval':'danger','Approved':'success','Rejected':'neutral'};
const EX_ICON = {'Pending Approval':'alert','Approved':'check','Rejected':'x'};
const EX_LABEL = {'Pending Approval':'Awaiting review','Approved':'Approved, fix assigned','Rejected':'Rejected'};
function openException(j){ return j.exceptions.find(e=>e.status==='Pending Approval') || null; }
function isOnHold(j){ return !!openException(j); }
function customsHold(j){ return (j.customs && j.customs.hold && STATUS_STEPS[j.statusIndex]===CUSTOMS_PHASE) ? j.customs.hold : null; }
function correctiveOpen(j){ return j.tasks.filter(t=>t.corrective && !t.done); }

/* ============================== FEE CLOCKS ==============================
   Two countdowns decide real money: free storage at the port, and free detention on the shipping
   line's container once it leaves the port. Only one runs at a time. */
const FREE_WINDOW_DAYS = 7;
function deadlineInfo(j){
  const phase = STATUS_STEPS[j.statusIndex];
  const ret = j.tasks.find(t=>t.detention);
  const containerReturned = ret ? ret.done : false;
  const atPort = ['Arrived at Port', CUSTOMS_PHASE].includes(phase);
  const withTrucker = ['Out for Delivery','Delivered'].includes(phase) && !containerReturned;
  if(atPort && j.storageDeadline) return { type:'storage', label:'Free storage', who:'port', days:daysUntil(j.storageDeadline), deadline:j.storageDeadline };
  if(withTrucker && j.detentionDeadline) return { type:'detention', label:'Free detention', who:'shipping line', days:daysUntil(j.detentionDeadline), deadline:j.detentionDeadline };
  return null;
}
function clockTone(days){ return days==null ? 'neutral' : days<0 ? 'danger' : days<=2 ? 'warning' : 'neutral'; }
function clockText(info){
  if(!info || info.days==null) return '';
  if(info.days<0) return 'Fees running for '+Math.abs(info.days)+' day'+(Math.abs(info.days)===1?'':'s');
  if(info.days===0) return 'Last free day today';
  return info.days+' free day'+(info.days===1?'':'s')+' left';
}

/* ============================== MONEY ==============================
   A per-job notebook, not accounting. Reimbursable = paid for the client and billed back at cost.
   Service fee = Top1Movers' own income. Margin = service fees + markup − any cost we absorb. */
const GAP_HORIZON_DAYS = 7;
function money(n){ return '₱' + Number(n).toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function moneyShort(n){ const a = Math.abs(n); const s = a>=1e6 ? (a/1e6).toFixed(2).replace(/\.?0+$/,'')+'M' : a>=1e3 ? Math.round(a/1e3)+'K' : String(a); return (n<0?'−':'')+'₱'+s; }
function moneySigned(n){ return (n<0?'−':'')+money(Math.abs(n)); }
const sumOf = (list, fn)=>list.reduce((t,x)=>t+fn(x),0);
const isReimbursable = c => c.type!=='Service fee';
const isAbsorbed = c => !!(c.approval && c.approval.status==='Absorbed');
const isUnresolved = c => c.quoted===false && !c.approval;
function jobFunds(j){
  const received = sumOf(j.fundsReceived, f=>f.amount);
  const paidCosts = j.charges.filter(c=>isReimbursable(c) && c.paidDate && !isAbsorbed(c));
  const disbursed = sumOf(paidCosts, c=>c.amount);
  const balance = received - disbursed;
  const serviceFees = sumOf(j.charges.filter(c=>!isReimbursable(c) && !isAbsorbed(c)), c=>c.amount);
  const markup = sumOf(j.charges.filter(c=>isReimbursable(c) && !isAbsorbed(c)), c=>c.markup||0);
  const ourFees = serviceFees + markup;
  const settlement = balance - ourFees;
  const rows = [];
  j.fundsReceived.forEach(f=>rows.push({ kind:'in', date:f.date, d:parseDMY(f.date), label:f.method+(f.reference?' · '+f.reference:''), evidence:f.evidence, amount:f.amount, ref:f }));
  paidCosts.forEach(c=>rows.push({ kind:'out', date:c.paidDate, d:parseDMY(c.paidDate), label:c.desc, evidence:c.evidence, amount:c.amount, ref:c }));
  rows.sort((a,b)=>(a.d-b.d) || ((a.kind==='in'?0:1)-(b.kind==='in'?0:1)));
  let run = 0; rows.forEach(r=>{ run += r.kind==='in' ? r.amount : -r.amount; r.balance = run; });
  return { received, disbursed, balance, serviceFees, markup, ourFees, settlement, ledger:rows };
}
function awaitingClientDuty(j){ return STATUS_STEPS[j.statusIndex]===CUSTOMS_PHASE && !!j.customs && j.customs.paymentParty==='Client' && CUSTOMS_SUBSTAGES[j.customs.subIndex]==='Payment Pending'; }
function fundingGap(j){
  const f = jobFunds(j);
  const due = j.charges.filter(c=>isReimbursable(c) && !c.paidDate && !isAbsorbed(c) && c.dueDate && daysUntil(c.dueDate)!==null && daysUntil(c.dueDate)<=GAP_HORIZON_DAYS)
    .sort((a,b)=>parseDMY(a.dueDate)-parseDMY(b.dueDate));
  const need = sumOf(due, c=>c.amount);
  if(!due.length || need<=f.balance) return null;
  const cover = Math.max(0, f.balance), short = need - f.balance;
  const first = due[0], last = due[due.length-1];
  const text = (due.length===1 ? first.desc+' of '+money(need)+' is due '+shortDate(first.dueDate)+'.' : due.length+' payments totalling '+money(need)+' are due by '+shortDate(last.dueDate)+'.')+
    ' Client funds on hand cover '+money(cover)+', so we are short by '+money(short)+'.';
  const info = deadlineInfo(j);
  let storageText = '';
  if(info && info.type==='storage' && info.days!=null && info.days<=3){
    storageText = info.days<0 ? 'Free storage has already ended, so storage fees are building up.'
      : info.days===0 ? 'Free storage ends today; fees start tomorrow.'
      : 'Free storage ends in '+info.days+' day'+(info.days===1?'':'s')+', and the goods cannot leave until duties are paid.';
  }
  return { due, need, cover, short, text, storageText, first, funds:f };
}
const CHARGE_CATEGORIES = ['Freight','Duties & Taxes','Fees','Other'];
function categoryOf(c){ return CHARGE_CATEGORIES.includes(c.category) ? c.category : 'Other'; }
function quoteAmountForJob(j){
  if(j.quotationId && QUOTATIONS[j.quotationId]){ const q = QUOTATIONS[j.quotationId]; return q.versions[q.versions.length-1].total; }
  return Math.round((j.declaredValue||0)/6);
}
function jobCostMargin(j){
  const quoted = quoteAmountForJob(j);
  const billable = j.charges.filter(c=>!isAbsorbed(c));
  const reimbursable = sumOf(billable.filter(isReimbursable), c=>c.amount);
  const serviceFees = sumOf(billable.filter(c=>!isReimbursable(c)), c=>c.amount);
  const markup = sumOf(billable.filter(isReimbursable), c=>c.markup||0);
  const absorbedCost = sumOf(j.charges.filter(isAbsorbed), c=>c.amount);
  const actual = sumOf(j.charges, c=>c.amount);
  const billed = reimbursable + serviceFees + markup;
  const margin = serviceFees + markup - absorbedCost;
  const marginPct = billed ? (margin/billed*100) : 0;
  const byCategory = CHARGE_CATEGORIES.map(cat=>{ const amount = sumOf(j.charges.filter(c=>categoryOf(c)===cat), c=>c.amount); return { category:cat, amount, pct: actual ? amount/actual*100 : 0 }; });
  return { quoted, actual, reimbursable, serviceFees, markup, absorbedCost, billed, margin, marginPct, byCategory, hasQuotation: !!(j.quotationId && QUOTATIONS[j.quotationId]) };
}

/* ============================== BILLING CHECKLIST ============================== */
function billingChecklist(j){
  const open = openTasks(j);
  const unapproved = j.documents.filter(d=>d.status!=='Approved');
  const damage = j.delivery.confirmed && j.delivery.damage && !j.delivery.damageResolved;
  return [
    { key:'tasks', label:'All tasks done', sub: open.length ? open.length+' open: '+open.map(t=>t.name).join(', ') : null, ok: !open.length, tab:'tasks' },
    { key:'docs', label:'All documents approved', sub: unapproved.length ? unapproved.map(d=>d.name).join(', ') : null, ok: !unapproved.length, tab:'documents' },
    { key:'pod', label:'Delivery confirmed with proof, no unresolved damage', sub: !j.delivery.confirmed ? 'Not delivered yet' : damage ? 'Damage reported and not yet resolved' : null, ok: j.delivery.confirmed && !damage, tab:'delivery' },
    { key:'ex', label:'No open exceptions', ok: !openException(j), tab:'exceptions' },
    { key:'extra', label:'Extra charges decided (client approved or absorbed)', sub: j.charges.filter(isUnresolved).map(c=>c.desc+' '+money(c.amount)).join(', ')||null, ok: !j.charges.some(isUnresolved), tab:'money' },
    { key:'charges', label:'At least one charge recorded', ok: j.charges.length>0, tab:'money' }
  ];
}

/* ============================== HEALTH ==============================
   Two separate questions, two separate signals. WHERE is the job? Its stage, always neutral navy.
   IS IT OK? Its health: On track (green), Needs attention (amber), Blocked (red: it cannot move). */
function jobHealth(j){
  const s = j.statusIndex;
  if(s===8) return { tone:'neutral', label:'Closed', icon:'check', reasons:[] };
  const blocked = [], attention = [];
  const ex = openException(j); if(ex) blocked.push('Exception awaiting review: '+ex.category);
  const hold = customsHold(j); if(hold) blocked.push('Customs hold: '+hold.type);
  const overdue = j.tasks.filter(t=>taskStatus(j,t)==='Overdue'); if(overdue.length) attention.push(overdue.length+' overdue task'+(overdue.length>1?'s':''));
  const bad = j.documents.filter(d=>docProblem(j,d)); if(bad.length) attention.push(bad.length+' document'+(bad.length>1?'s':'')+' missing or rejected');
  const clock = deadlineInfo(j); if(clock && clock.days!=null && clock.days<=2) attention.push(clock.label+': '+clockText(clock).toLowerCase());
  if(canSeeFunds() && fundingGap(j)) attention.push('Short on client funds');
  if(canSeeFunds() && j.charges.some(isUnresolved)) attention.push('Extra charge needs a decision');
  if(j.delivery.confirmed && j.delivery.damage && !j.delivery.damageResolved) attention.push('Damage reported at delivery');
  if(blocked.length) return { tone:'danger', label:'Blocked', icon:'lock', reasons:blocked.concat(attention) };
  if(attention.length) return { tone:'warning', label:'Needs attention', icon:'alert', reasons:attention };
  if(s===7) return { tone:'brand', label:'With Finance', icon:'receipt', reasons:[] };
  return { tone:'success', label:'On track', icon:'check', reasons:[] };
}

/* ============================== THE NEXT-STEP ENGINE ==============================
   Every stage has a gate: the few things that must be true before a job can leave it. The job page
   shows the gate as a checklist, puts the fix next to every unmet line, and offers exactly one
   primary action. This replaces "pick the next status from a list where everything else is
   disabled": the rule is visible, so nobody has to know it in advance. */
function act(label, js, icon){ return { label, js, icon:icon||null }; }
function taskGateItem(j, name, sub){
  const t = taskByName(j, name);
  if(!t) return null;
  const st = taskStatus(j,t);
  return { label:'Task: '+name, sub: t.done ? 'Done by '+(t.doneBy||t.owner) : (sub || (t.owner+' · due '+shortDate(t.due)+(st==='Overdue'?' (overdue)':'')+(t.requiresEvidence?' · needs proof':''))),
    met:t.done, overdue: st==='Overdue', short: (t.via==='delivery'?'Confirm delivery with proof':name)+(st==='Overdue'?' (overdue)':''),
    act: t.done ? null : (t.via==='delivery' ? (canConfirmDelivery() ? act('Confirm delivery',"openConfirmDelivery('"+j.id+"')",'truck') : null)
      : canCompleteTask(t) ? act('Complete task',"openCompleteTask('"+j.id+"','"+t.id+"')",'check') : null) };
}
function docGateItems(j){
  const items = [];
  const ok = j.documents.filter(d=>d.status==='Approved');
  if(ok.length) items.push({ label: ok.length===j.documents.length ? 'All '+ok.length+' documents approved' : ok.length+' of '+j.documents.length+' documents approved', met:true, sub: ok.length===j.documents.length ? null : ok.map(d=>d.name).join(', '), act:null });
  j.documents.filter(d=>d.status!=='Approved').forEach(d=>{
    let a = null, sub = '';
    if(d.status==='Missing'){ sub = 'Missing. Nobody has uploaded it yet.'; if(canUploadDocs()) a = act('Upload',"openUploadDoc('"+j.id+"','"+d.id+"')",'upload'); }
    else if(d.status==='Rejected'){ sub = 'Rejected: '+d.rejectReason; if(canUploadDocs()) a = act('Replace',"openUploadDoc('"+j.id+"','"+d.id+"')",'upload'); }
    else { sub = 'Uploaded (v'+d.version+'), waiting for someone to check it.'; if(canApproveDocs()) a = act('Review',"openReviewDoc('"+j.id+"','"+d.id+"')",'eye'); }
    items.push({ label:d.name, sub, met:false, act:a, short:(d.status==='Missing'?'Upload ':d.status==='Rejected'?'Replace rejected ':'Review ')+d.name });
  });
  return items;
}
function stageGate(j){
  const s = j.statusIndex, id = j.id;
  const move = (label, icon)=>act(label, "advanceStage('"+id+"')", icon||'arrow-right');
  const corrective = correctiveOpen(j).map(t=>({ short:'Fix: '+t.name, label:'Fix: '+t.name, sub:t.owner+' · due '+shortDate(t.due)+' (from an approved exception)', met:false, act: canCompleteTask(t) ? act('Complete task',"openCompleteTask('"+id+"','"+t.id+"')",'check') : null }));
  if(s===0) return { to:STATUS_STEPS[1], items:[{ label:'Vessel and voyage booked', met:!!j.vessel, act:null }].concat(corrective),
    advance:move('Start documentation'), why:'The next stage is collecting and checking the five shipping documents.' };
  if(s===1) return { to:STATUS_STEPS[2], items:docGateItems(j).concat([taskGateItem(j,'Verify shipment documents complete')]).concat(corrective).filter(Boolean),
    advance:move('Confirm vessel sailed','ship'), why:'Customs will reject an entry built on wrong paperwork, so documents are settled before the goods sail.' };
  if(s===2) return { to:STATUS_STEPS[3], items:corrective,
    advance:move('Confirm arrival at port','anchor'), why:'Arrival starts the free storage clock at the port. ETA '+(j.eta||'to be confirmed')+'.' };
  if(s===3) return { to:STATUS_STEPS[4], items:corrective,
    advance:move('Start customs clearance','shield'), why:'Free storage '+(j.storageDeadline?'ends '+shortDate(j.storageDeadline):'is running')+'. Clearing customs quickly is what stops port fees.' };
  if(s===4){
    const sub = j.customs ? j.customs.subIndex : 0, cur = CUSTOMS_SUBSTAGES[sub], nxt = CUSTOMS_SUBSTAGES[sub+1];
    let items = [];
    if(cur==='Lodging Pending') items.push(taskGateItem(j,'Lodge customs entry'));
    if(cur==='Payment Pending'){
      if(j.customs.paymentParty==='Client') items.push({ label:'Client has released the duty payment', sub:'Chase '+custById(j.customerId).contact.name+' at '+custById(j.customerId).name+'.', met:false, act: canMoveStage() ? act('Client has paid',"openConfirmClientPaid('"+id+"')",'check') : null, waitingClient:true, short:'Waiting on the client to pay duties' });
      const gap = fundingGap(j);
      if(gap) items.push({ label:'Enough client funds to pay the duty', sub:'Short by '+money(gap.short)+'. '+(canSeeFunds()?'':'A Manager records the deposit.'), met:false, act: canManageFunds() ? act('Add funds received',"openAddFunds('"+id+"')",'wallet') : null, short:'Client funds short by '+money(gap.short) });
      else if(canSeeFunds() && j.charges.some(c=>c.dueDate && !c.paidDate)) items.push({ label:'Enough client funds to pay the duty', met:true, act:null });
      items.push(taskGateItem(j,'Pay duties and assessment'));
    }
    if(cur==='Release Pending') items.push(taskGateItem(j,'Secure delivery order'));
    if(cur==='Released') items.push(taskGateItem(j,'Book delivery truck'));
    items = items.concat(corrective).filter(Boolean);
    if(cur==='Released') return { to:STATUS_STEPS[5], items, advance:move('Send out for delivery','truck'), customs:true, why:'Customs has released the goods. Once a truck is booked the container can leave the port.' };
    const js = nxt==='Payment Pending' ? "openAdvanceCustoms('"+id+"')" : "advanceCustoms('"+id+"')";
    const whyC = { 'Lodging Pending':'The customs entry (the official declaration) has to be filed first.', 'Lodged':'Customs has the entry and will work out the duties.', 'Assessment Pending':'Once customs states the duty amount, it has to be paid.',
      'Payment Pending':'Customs releases nothing until duties are paid.', 'Payment Completed':'Paid. Next, customs processes the release.', 'Release Pending':'The shipping line issues a delivery order so the trucker can collect the container.' }[cur];
    return { to:'Customs: '+nxt, items, advance:act('Mark as '+nxt, js, 'arrow-right'), customs:true, why:whyC };
  }
  if(s===5) return { to:STATUS_STEPS[6], items:[taskGateItem(j,'Deliver to consignee','Receiver name and proof of delivery (photo or signed paper)')].concat(corrective).filter(Boolean),
    advance:null, why:'Delivered can only be set by confirming the delivery with proof. That proof is what makes the job billable.' };
  if(s===6){
    const items = billingChecklist(j).map(c=>{
      let a = null;
      if(!c.ok){
        if(c.key==='tasks'){ const t = openTasks(j)[0]; if(t && canCompleteTask(t)) a = act('Complete '+t.name.toLowerCase(),"openCompleteTask('"+id+"','"+t.id+"')",'check'); }
        else if(c.key==='extra' && canManageFunds()){ const ch = j.charges.find(isUnresolved); a = act('Decide',"openDecideCharge('"+id+"','"+ch.id+"')",'receipt'); }
        else if(c.key==='charges' && canManageFunds()) a = act('Add charge',"openAddCharge('"+id+"')",'plus');
        else if(c.key==='pod' && isManagerLike() && j.delivery.damage) a = act('Resolve damage',"openResolveDamage('"+id+"')",'check');
        else a = act('Open', "goTab('"+id+"','"+c.tab+"')", 'arrow-right');
      }
      return { label:c.label, sub:c.sub, met:c.ok, act:a };
    });
    const left = items.filter(x=>!x.met).length;
    return { to:STATUS_STEPS[7], short: left ? plural(left,'check')+' left before Finance' : null, items, advance: act('Mark ready for Finance',"markBillingReady('"+id+"')",'receipt'), managerOnly:true,
      why:'Finance receives one clean, checked job instead of chasing people for receipts.' };
  }
  if(s===7) return { to:STATUS_STEPS[8], items:[{ label:'Billing Summary handed to Finance', met:true, act:null }], advance:act('Close job',"advanceStage('"+id+"')",'check'), managerOnly:true,
    why:'Closing freezes the record. Everything stays in the history.' };
  return null;
}
function nextStep(j){
  const id = j.id, s = j.statusIndex;
  if(s===8) return { tone:'done', icon:'check', eyebrow:'Complete', title:'This job is closed', text:'Every stage, document, delivery proof and peso is on record. Nothing left to do.', items:[], primary:null, tab:'history', short:'Closed' };
  const ex = openException(j);
  if(ex){
    const mgr = canApproveExceptions();
    return { tone:'blocked', icon:'lock', eyebrow:'Blocked · exception', title:ex.category+': waiting for a manager’s decision',
      text:ex.reason+' The job is frozen until a Manager or Admin reviews it and names a fix.',
      items:[{ short:'Exception awaiting a manager', label:'Exception reviewed by a Manager or Admin', sub:'Raised by '+ex.raisedBy+' on '+shortDate(ex.date)+' · impact '+ex.impact, met:false, blocked:true, act: mgr ? act('Review',"openReviewException('"+id+"','"+ex.id+"')",'eye') : null }],
      primary: mgr ? act('Review exception',"openReviewException('"+id+"','"+ex.id+"')",'eye') : null,
      who: mgr ? null : 'Waiting on a Manager or Admin. Grace Tan has it on her Home page.', tab:'exceptions', short:'Exception: awaiting manager' };
  }
  const hold = customsHold(j);
  if(hold){
    const mgr = isManagerLike();
    return { tone:'blocked', icon:'lock', eyebrow:'Blocked · customs hold', title:'Customs: '+hold.type,
      text:hold.note+' Lane '+j.customs.lane+': '+LANE_MEANING[j.customs.lane]+' Customs steps are frozen until the hold is cleared.',
      items:[{ label:'Hold cleared by a Manager or Admin', sub:'Placed '+(hold.on?shortDate(hold.on):'')+(hold.by?' by '+hold.by:''), met:false, blocked:true, act: mgr ? act('Clear hold',"clearCustomsHold('"+id+"')",'check') : null }],
      primary: mgr ? act('Clear hold',"clearCustomsHold('"+id+"')",'check') : null,
      who: mgr ? 'Clear it only once customs has finished the inspection.' : 'Waiting on customs, then a Manager clears the hold.', tab:'tasks', short:'Customs hold' };
  }
  const g = stageGate(j);
  const unmet = g.items.filter(i=>!i.met);
  const waitingClient = unmet.some(i=>i.waitingClient);
  const mayAdvance = g.managerOnly ? isManagerLike() : canMoveStage();
  const firstAct = unmet.map(i=>i.act).find(Boolean) || null;
  const tabFor = ()=>{ if(s===1) return 'documents'; if(s===5) return 'delivery'; if(s===6||s===7) return canSeeFunds()?'money':'tasks'; return 'tasks'; };
  if(!unmet.length){
    if(s===5) return null; // unreachable: delivery item is never met before delivery moves the stage
    return { tone:'ready', icon:g.advance.icon||'arrow-right', eyebrow:'Next step', title:g.advance.label, text:'Everything needed to reach '+g.to+' is done. '+(g.why||''),
      items:g.items, gateTitle:'Ready to leave '+(g.customs?'customs step '+CUSTOMS_SUBSTAGES[j.customs.subIndex]:STATUS_STEPS[s]),
      primary: mayAdvance ? g.advance : null,
      who: mayAdvance ? null : 'Waiting on '+(g.managerOnly?'a Manager or Admin':coordinatorFor(j.customerId)+' (Dispatcher)')+' to move it on.', tab:tabFor(), short:g.advance.label };
  }
  const n = unmet.length;
  return { tone: waitingClient ? 'waiting' : (firstAct ? 'ready' : 'waiting'), icon: waitingClient ? 'clock' : 'flag',
    eyebrow: waitingClient ? 'Waiting on the client' : 'To reach '+g.to,
    title: waitingClient ? 'Client to release the duty payment' : n+' thing'+(n>1?'s':'')+' left before '+g.to,
    text: g.why||'', items:g.items, gateTitle:'What must be true first',
    primary: firstAct, locked: g.advance ? g.advance.label : null,
    who: firstAct ? null : 'Waiting on '+(s===5?'the delivery crew ('+crewFor(j)+')':coordinatorFor(j.customerId)+' (Dispatcher)')+'.',
    tab:tabFor(), short: g.short || unmet[0].short || unmet[0].label };
}

function openCmdk(){

function renderCmdkList(q){

let LAST_HASH = null;
function render(){
  const hash = (location.hash||'#/login').replace(/^#\//,'');
  let parts = hash.split('/').filter(Boolean);
  const root = document.getElementById('app');
  closeDrawer(); closePopover(); closeAvatarMenu();
  const sameRoute = hash === LAST_HASH;
  const newSection = !LAST_HASH || LAST_HASH.split('/')[0] !== (parts[0]||'');
  LAST_HASH = hash;
  const active = document.activeElement;
  const focusId = active && active.id ? active.id : null;
  const selStart = focusId && typeof active.selectionStart==='number' ? active.selectionStart : null;
  const scrollY = window.scrollY;

  if(parts[0]==='track') root.innerHTML = renderTrackPage(parts[1]);
  else if(parts[0]==='login' || !parts.length) root.innerHTML = renderLogin();

  }
  if(newSection){ root.classList.remove('ds-motion-in'); void root.offsetWidth; root.classList.add('ds-motion-in'); }
  if(focusId){ const el = document.getElementById(focusId); if(el && el.focus){ el.focus({preventScroll:true}); if(selStart!=null && el.setSelectionRange) try{ el.setSelectionRange(selStart, selStart); }catch(e){} } }
  window.scrollTo(0, sameRoute ? scrollY : 0);
  const cur = document.querySelector('#journey [data-state="current"], #journey [data-state="blocked"]');
  if(cur){ const tr = cur.parentElement; tr.scrollLeft = cur.offsetLeft - tr.clientWidth/2 + cur.clientWidth/2; }
  STATE.justAdvanced = null; STATE.justNext = null;
}

/* Stands in for Microsoft's "Pick an account" step: a handful of known accounts, never a directory. */
function openAcctPicker(){
  const rows = USERS.map(u=>'<button type="button" class="ds-acct-row" '+(u.active?'':'disabled aria-disabled="true" ')+'onclick="pickAccount(\''+esc(u.name)+'\')">'+
      avatar(u.name)+'<span class="ds-acct-row__main"><span class="ds-acct-row__name">'+esc(u.name)+'</span><span class="ds-acct-row__email">'+esc(emailForUser(u.name))+'</span></span>'+
      '<span class="ds-acct-row__role">'+esc(u.role+(u.active?'':' · Deactivated'))+'</span></button>').join('');
  const el = document.getElementById('acctPickerRoot');
  el.innerHTML = '<div class="ds-acct-picker" role="dialog" aria-modal="true" aria-label="Pick an account">'+
    '<div class="ds-acct-picker__head">'+msLogo()+'<h2>Pick an account</h2><p class="ds-muted ds-small">to continue to Top1Movers Operations Portal</p></div>'+
    '<div class="ds-acct-picker__list">'+rows+
      '<button type="button" class="ds-acct-row" onclick="showToast(\'This mockup only has the demo accounts above.\',\'info\',\'info\')"><span class="ds-acct-row__addicon">'+icon('plus')+'</span><span class="ds-acct-row__main"><span class="ds-acct-row__name">Use another account</span></span></button>'+
    '</div><div class="ds-acct-picker__foot">Demo only. Illustrative accounts, not a real directory.</div></div>';
  el.classList.add('open');
}
function closeAcctPicker(){ const el=document.getElementById('acctPickerRoot'); el.classList.remove('open'); el.innerHTML=''; }
function pickAccount(name){
  const u = userByName(name);
  if(!u || !u.active){ showToast('That account is deactivated. An Admin can switch it back on.', 'danger', 'alert'); return; }
  closeAcctPicker(); signInAs(name);
}
function signInAs(name, route){
  const u = userByName(name);
  CURRENT_USER = { name:u.name, role:u.role };
  go(route || '#/home');
}
function signOut(){ CURRENT_USER = null; go('#/login'); }

/* ============================== SHELL ============================== */
function navItem(key, label, ic, parts, count, alert_, desktopOnly){
  const cur = parts[0]===key;
  return '<button class="ds-nav__item'+(desktopOnly?' ds-nav__item--desktop':'')+'" aria-current="'+(cur?'page':'false')+'" onclick="go(\'#/'+key+'\')" title="'+esc(label)+'">'+
    icon(ic)+'<span data-text="'+esc(label)+'">'+esc(label)+'</span>'+(count!=null&&count!==0?'<em class="ds-nav__count'+(alert_?' ds-nav__count--alert':'')+'">'+count+'</em>':'')+'</button>';
}
function navShortLabel(full, short){ return window.innerWidth<=640 ? short : full; }

  const r = role();
  const myCount = homeQueueCount();
  const adminGroup = can('User & Role Mgmt') || can('Audit Trail');
  const reports = ['Manager','Admin','Finance'].includes(r);
  const openInq = INQUIRIES.filter(i=>['New','Quoted','Approved'].includes(inquiryStage(i).key)).length;
  return '<div class="ds-shell">'+
    '<aside class="ds-sidebar">'+
      '<div class="ds-sidebar__brand"><img src="'+LOGO_SRC+'" alt="Top1Movers"></div>'+
      '<nav class="ds-nav" aria-label="Main">'+
        '<div class="ds-nav__group">Work</div>'+
        navItem('home', navShortLabel(r==='Finance'?'Finance desk':(['Dispatcher','Warehouse Crew'].includes(r)?'My work':'Command center'),'Home'), 'home', parts, myCount, true)+
        (can('Shipment Job') ? navItem('jobs', navShortLabel(isCrew()?'My shipments':'Shipments','Shipments'), 'box', parts, JOBS.filter(j=>canSeeJob(j) && j.statusIndex<8).length) : '')+
        (can('Inquiry & Quotation') ? navItem('inquiries', navShortLabel('Inquiries & quotes','Sales'), 'quote', parts, openInq) : '')+
        (can('Customer Mgmt') ? navItem('customers', 'Customers', 'building', parts, null, false, reports) : '')+
        (reports ? '<div class="ds-nav__group">Insight</div>'+navItem('reports','Reports','chart',parts) : '')+
        (adminGroup ? '<div class="ds-nav__group">Admin</div>' : '')+
        (can('User & Role Mgmt') ? navItem('users','Users & roles','users',parts,null,false,true) : '')+
        (can('Audit Trail') ? navItem('audit','Audit trail','clock',parts,null,false,r!=='Finance') : '')+
      '</nav>'+
      '<div class="ds-sidebar__foot"><span class="ds-mockbadge">'+icon('info')+'Sample data · today is 28 Sep 2026</span></div>'+
    '</aside>'+
    '<header class="ds-topbar">'+
      '<a class="ds-topbar__brand" href="#/home" aria-label="Home"><img src="'+LOGO_SRC+'" alt="Top1Movers"></a>'+
      '<div class="ds-search">'+icon('search')+'<input class="ds-input" id="top-search" placeholder="Search job, container, BL, customer" readonly onclick="openCmdk()" onfocus="this.blur(); openCmdk()"><kbd class="ds-kbd">'+(navigator.platform.includes('Mac')?'⌘K':'Ctrl K')+'</kbd></div>'+

      avatarMenuHtml()+
    '</header>'+
    '<main class="ds-content" id="main">'+pageFor(parts)+'</main>'+

}
function avatarMenuHtml(){
  const others = USERS.filter(u=>u.active && u.name!==CURRENT_USER.name).map(u=>'<button class="ds-menu__action" onclick="switchPerson(\''+esc(u.name)+'\')">'+avatar(u.name,true)+'<span>'+esc(u.name)+' <span class="ds-muted3 ds-xs">'+esc(u.role)+'</span></span></button>').join('');
  const phoneLinks = (can('Customer Mgmt')?'<button class="ds-menu__action ds-show-phone" onclick="go(\'#/customers\')">'+icon('building')+'Customers</button>':'')+
    (can('User & Role Mgmt')?'<button class="ds-menu__action ds-show-phone" onclick="go(\'#/users\')">'+icon('users')+'Users &amp; roles</button>':'')+
    (can('Audit Trail')?'<button class="ds-menu__action ds-show-phone" onclick="go(\'#/audit\')">'+icon('clock')+'Audit trail</button>':'');
  return '<div class="ds-menu-trigger" id="avatar-menu">'+
    '<button class="ds-avatar" style="background:'+avatarBg(CURRENT_USER.name)+'" onclick="toggleAvatarMenu(event)" aria-haspopup="true" aria-label="Account menu">'+icon('user')+'</button>'+
    '<div class="ds-menu ds-menu--right" style="min-width:260px;max-height:none">'+
      '<div class="ds-menu__header"><strong>'+esc(CURRENT_USER.name)+'</strong><span>'+esc(CURRENT_USER.role)+' · '+esc(ROLE_BLURB[CURRENT_USER.role])+'</span></div>'+

      '<div class="ds-menu__sep"></div>'+
      '<button class="ds-menu__action ds-menu__action--danger" onclick="signOut()">'+icon('log-out')+'Sign out</button>'+

function toggleAvatarMenu(ev){
  ev.stopPropagation();
  const el = document.getElementById('avatar-menu');
  const opening = !el.hasAttribute('data-open');
  closeAvatarMenu();
  if(opening){ el.setAttribute('data-open',''); setTimeout(()=>document.addEventListener('click', avatarOutside), 0); }
}
function avatarOutside(e){ const el = document.getElementById('avatar-menu'); if(el && !el.contains(e.target)) closeAvatarMenu(); }
function closeAvatarMenu(){ const el=document.getElementById('avatar-menu'); if(el) el.removeAttribute('data-open'); document.removeEventListener('click', avatarOutside); }
function switchPerson(name){
  const u = userByName(name);
  CURRENT_USER = { name:u.name, role:u.role };
  showToast('Now signed in as '+u.name+' ('+u.role+').', 'info', 'user');
  const parts = (location.hash||'').replace(/^#\//,'').split('/');
  const section = parts[0];
  const allowed = { home:true, jobs:can('Shipment Job'), inquiries:can('Inquiry & Quotation'), customers:can('Customer Mgmt'), reports:['Manager','Admin','Finance'].includes(u.role), users:can('User & Role Mgmt'), audit:can('Audit Trail') };
  if(section==='jobs' && parts[1]){ const j = jobById(parts[1]); if(j && !canSeeJob(j)){ go('#/home'); return; } }
  if(!allowed[section]) go('#/home'); else render();
}
function accessDenied(what, detail){
  return '<div class="ds-panel ds-panel--elevated" id="access-denied">'+emptyState('lock', 'Not available for '+role(), (detail||what+' is not part of the '+role()+' role.')+' Menus a role cannot use are hidden, and typing the address does not get around it.',
    '<a class="ds-btn ds-btn--secondary" href="#/home">'+icon('home')+'Back to Home</a>')+'</div>';
}

/* ============================== NOTIFICATIONS ==============================
   Overdue tasks escalate by email to their owner. Here the bell shows the same list, and the drawer
   previews exactly what that email says (nothing is actually sent). */
function myAlerts(){
  const out = [];
  JOBS.filter(canSeeJob).forEach(j=>j.tasks.forEach(t=>{
    if(taskStatus(j,t)==='Overdue' && (isManagerLike() || t.owner===CURRENT_USER.name)) out.push({ j, t });
  }));
  return out;
}
function notificationsButton(){
  const n = myAlerts().length;
  return '<button class="ds-topbar-btn" id="bell" onclick="openNotifications()" aria-label="Notifications'+(n?', '+n+' overdue':'')+'">'+icon('bell')+(n?'<span class="ds-topbar-btn__dot">'+n+'</span>':'')+'</button>';
}
function openNotifications(){
  const list = myAlerts();
  if(!list.length){ openDrawer({ title:'Notifications', body: emptyState('check','Nothing overdue','When a task passes its due date, its owner gets an email and it shows up here.') }); return; }
  const first = list[0];
  const c = custById(first.j.customerId);
  const late = -daysUntil(first.t.due);
  const body = '<div class="ds-stack--sm">'+
    '<p class="ds-muted ds-small">'+plural(list.length,'task')+' past due. Each owner was emailed automatically.</p>'+
    '<ul class="ds-queue ds-panel">'+list.map(({j,t},i)=>'<li class="ds-queue__item" data-tone="danger" style="--i:'+i+'"><span class="ds-queue__icon">'+icon('alert')+'</span><div><div class="ds-queue__title">'+esc(t.name)+'</div><div class="ds-queue__meta"><span class="ds-mono">'+j.id+'</span><span>'+esc(t.owner)+'</span><span class="ds-overdue">due '+shortDate(t.due)+'</span></div></div>'+
      '<div class="ds-queue__actions"><button class="ds-btn ds-btn--secondary ds-btn--sm" onclick="closeDrawer(); goTab(\''+j.id+'\',\'tasks\')">Open</button></div></li>').join('')+'</ul>'+
    '<div class="ds-label" style="margin-top:var(--t1m-space-5)">The email '+esc(first.t.owner.split(' ')[0])+' received</div>'+
    '<div class="ds-email">'+
      '<div class="ds-email__head"><div><strong>From:</strong> Top1Movers Operations Portal &lt;no-reply@t1m-portal.example&gt;</div><div><strong>To:</strong> '+esc(emailForUser(first.t.owner))+'</div><div><strong>Subject:</strong> [Overdue] '+esc(first.t.name)+', '+first.j.id+' is '+plural(late,'day')+' late</div></div>'+
      '<div class="ds-email__body ds-stack--sm"><p>Hi '+esc(first.t.owner.split(' ')[0])+',</p><p>The task <strong>'+esc(first.t.name)+'</strong> on job <strong class="ds-mono">'+first.j.id+'</strong> for '+esc(c.name)+' was due <strong>'+esc(first.t.due)+'</strong>.</p>'+
      '<p>Please complete it or ask your manager to reassign it, so customs clearance is not delayed.</p><p class="ds-muted ds-xs">Illustration only. No email is sent from this mockup.</p></div>'+
    '</div></div>';
  openDrawer({ title:'Notifications', sub:'Overdue escalations', body });
}

function startScenario(i){
  const s = SCENARIOS[i];
  closeDrawer();
  if(!s.who){ CURRENT_USER = null; go(s.route); return; }
  const u = userByName(s.who);
  if(!u.active){ showToast(s.who+' is deactivated in this session. Reset demo data first.', 'danger', 'alert'); return; }
  signInAs(s.who, s.route);
  showToast('Scenario '+(i+1)+': signed in as '+s.who+' ('+u.role+').', 'info', 'play');
}
function resetDemo(){ location.hash = '#/login'; location.reload(); }

/* ============================== PAGE ROUTER ============================== */
function pageFor(parts){
  const [section, id, sub] = parts;
  switch(section){
    case 'home': return renderHome();
    case 'jobs':
      if(!can('Shipment Job')) return accessDenied('Shipments');
      if(id && sub==='billing-summary') return renderBillingSummaryPage(id);
      return id ? renderJob(id, sub) : renderJobsList();
    case 'inquiries': return can('Inquiry & Quotation') ? (id ? renderInquiry(id) : renderInquiries()) : accessDenied('Inquiries & quotes');
    case 'customers': return can('Customer Mgmt') ? (id ? renderCustomer(id) : renderCustomers()) : accessDenied('Customers');
    case 'reports': return ['Manager','Admin','Finance'].includes(role()) ? renderReports() : accessDenied('Reports', isDispatcher() ? 'Your Home page already shows your own customers’ figures.' : null);
    case 'users': return can('User & Role Mgmt') ? renderUsers() : accessDenied('Users & roles');
    case 'audit': return can('Audit Trail') ? renderAudit() : accessDenied('Audit trail');
    default: return renderHome();
  }
}

/* ---- src/40-home.js ---- */
/* ============================== HOME ==============================
   Every role lands on Home and it answers the same question for each of them: what needs me today?
   Manager/Admin: a command center (decisions, money, deadlines across all jobs).
   Dispatcher: my tasks, my customers' shipments, my sales follow-ups.
   Warehouse Crew: today's deliveries and containers to return, touch-first.
   Finance: jobs waiting for Finance and how each one settles. */
const TONE_RANK = { danger:0, warning:1, brand:2, info:3, success:4 };
/* Consequence order: frozen jobs first, then late work, then money, then clocks, then good news. */
const QUEUE_PRIO = { exception:0, hold:1, damage:2, overdue:3, expired:4, funds:5, charge:6, clock:7, finance:8 };
function greeting(){ return 'Good morning, '+CURRENT_USER.name.split(' ')[0]+'.'; }
function todayLong(){ return 'Monday 28 September 2026'; }

function managerQueue(){
  const q = [];
  JOBS.forEach(j=>{
    const c = custById(j.customerId).name, id = j.id;
    const ex = openException(j);
    if(ex) q.push({ p:QUEUE_PRIO.exception, tone:'danger', icon:'flag', cat:'decisions', job:j, title:'Decide an exception: '+ex.category, why:ex.reason, whyTone:'danger',
      btn:{ label:'Review', js:"openReviewException('"+id+"','"+ex.id+"')" } });
    const hold = customsHold(j);
    if(hold) q.push({ p:QUEUE_PRIO.hold, tone:'danger', icon:'lock', cat:'decisions', job:j, title:'Customs hold: '+hold.type+' (lane '+j.customs.lane+')', why:hold.note, btn:{ label:'Open', js:"go('#/jobs/"+id+"')" } });
    if(j.delivery.confirmed && j.delivery.damage && !j.delivery.damageResolved) q.push({ p:QUEUE_PRIO.damage, tone:'danger', icon:'alert', cat:'decisions', job:j, title:'Damage reported at delivery', why:j.delivery.damageNote||'', btn:{ label:'Resolve', js:"openResolveDamage('"+id+"')" } });
    const gap = fundingGap(j);
    if(gap) q.push({ p:QUEUE_PRIO.funds, tone:'warning', icon:'wallet', cat:'money', job:j, title:'Short on client funds: '+gap.first.desc+' due '+shortDate(gap.first.dueDate), why:'Short by '+money(gap.short)+'. '+gap.storageText, whyTone:'warning', btn:{ label:'Add funds', js:"openAddFunds('"+id+"')" } });
    j.charges.filter(isUnresolved).forEach(ch=>q.push({ p:QUEUE_PRIO.charge, tone:'warning', icon:'receipt', cat:'money', job:j, title:'Extra charge not in the quote: '+ch.desc+' '+money(ch.amount), why:'Get client approval or absorb it before this job can go to Finance.', btn:{ label:'Decide', js:"openDecideCharge('"+id+"','"+ch.id+"')" } }));
    j.tasks.filter(t=>taskStatus(j,t)==='Overdue').forEach(t=>q.push({ p:QUEUE_PRIO.overdue, tone:'danger', icon:'alert', cat:'deadlines', job:j, title:'Overdue: '+t.name, why:t.owner+' · due '+shortDate(t.due)+', '+plural(-daysUntil(t.due),'day')+' late', whyTone:'danger', btn:{ label:'Reassign', js:"openReassignTask('"+id+"','"+t.id+"')" } }));
    const clk = deadlineInfo(j);
    if(clk && clk.days!=null && clk.days<=2) q.push({ p: clk.days<0?QUEUE_PRIO.expired:QUEUE_PRIO.clock, tone: clk.days<0?'danger':'warning', icon:'clock', cat:'deadlines', job:j, title:clk.label+': '+clockText(clk).toLowerCase(), why:(clk.days<0?'The '+clk.who+' is charging daily since ':'The '+clk.who+' starts charging after ')+shortDate(clk.deadline)+'.', whyTone:clk.days<0?'danger':'warning', btn:{ label:'Open', js:"go('#/jobs/"+id+"')" } });
    if(j.statusIndex===6 && billingChecklist(j).every(x=>x.ok)) q.push({ p:QUEUE_PRIO.finance, tone:'brand', icon:'receipt', cat:'money', job:j, title:'Ready to hand to Finance', why:'Every billing check is done.', btn:{ label:'Mark ready', js:"markBillingReady('"+id+"')" } });
  });
  return q.sort((a,b)=>a.p-b.p);
}
function dispatcherQueue(){
  const q = [];
  myJobs().forEach(j=>{
    const id = j.id;
    j.documents.forEach(d=>{
      if(d.status==='Pending Review') q.push({ tone:'info', icon:'eye', cat:'docs', job:j, title:'Review '+d.name, why:'Uploaded v'+d.version+'. Approve it or reject it with a reason.', btn:{ label:'Review', js:"openReviewDoc('"+id+"','"+d.id+"')" } });
      else if(docProblem(j,d)) q.push({ tone:'warning', icon:'upload', cat:'docs', job:j, title:(d.status==='Rejected'?'Replace ':'Upload ')+d.name, why: d.status==='Rejected' ? 'Rejected: '+d.rejectReason : 'Still missing. Chase the client or shipper for it.', btn:{ label:d.status==='Rejected'?'Replace':'Upload', js:"openUploadDoc('"+id+"','"+d.id+"')" } });
    });
    const n = nextStep(j);
    if(n && n.tone==='ready' && n.primary && n.primary.js.startsWith('advance')) q.push({ tone:'brand', icon:'arrow-right', cat:'moves', job:j, title:'Ready: '+n.primary.label, why:'Everything needed is done. One click moves it on.', btn:{ label:'Move on', js:n.primary.js } });
    const ex = openException(j);
    if(ex) q.push({ tone:'danger', icon:'lock', cat:'moves', job:j, title:'Blocked: '+ex.category, why:'Waiting for a Manager to review it. Nothing for you to do yet.', btn:{ label:'Open', js:"go('#/jobs/"+id+"')" } });
  });
  return q.sort((a,b)=>TONE_RANK[a.tone]-TONE_RANK[b.tone]);
}
function salesQueue(){
  return INQUIRIES.filter(i=>i.assignedTo===CURRENT_USER.name || isManagerLike()).map(i=>{
    const st = inquiryStage(i); if(!['New','Quoted','Approved'].includes(st.key)) return null;
    return { tone:'brand', icon:'quote', cat:'sales', inq:i, title:st.next+' · '+custById(i.customerId).name, why:i.cargo+', '+i.origin+' to '+i.destination, btn:{ label:'Open', js:"go('#/inquiries/"+i.id+"')" } };
  }).filter(Boolean);
}
function myTaskList(){
  const out = [];
  JOBS.filter(canSeeJob).forEach(j=>j.tasks.forEach(t=>{ if(!t.done && t.owner===CURRENT_USER.name) out.push({ j, t, st:taskStatus(j,t) }); }));
  const order = { 'Overdue':0, 'To do':1, 'Upcoming':2 };
  return out.sort((a,b)=>order[a.st]-order[b.st] || (parseDMY(a.t.due)-parseDMY(b.t.due)));
}
function crewDeliveries(){ return JOBS.filter(j=>canSeeJob(j) && j.statusIndex===5 && !j.delivery.confirmed); }
function homeQueueCount(){
  const r = role();
  if(r==='Manager'||r==='Admin') return managerQueue().filter(x=>x.tone==='danger'||x.tone==='warning'||x.tone==='brand').length;
  if(r==='Finance') return JOBS.filter(j=>j.statusIndex===7).length;
  if(r==='Warehouse Crew') return crewDeliveries().length + myTaskList().filter(x=>x.st!=='Upcoming').length;
  return myTaskList().filter(x=>x.st!=='Upcoming').length + dispatcherQueue().filter(x=>x.cat==='docs'||x.cat==='moves').length;
}

/* ---------- shared pieces ---------- */
function queueHtml(items, emptyText){
  if(!items.length) return '<div class="ds-queue__empty">'+icon('check')+'<span>'+esc(emptyText)+'</span></div>';
  return '<ul class="ds-queue">'+items.map((x,i)=>{
    const meta = x.job ? '<span class="ds-mono">'+x.job.id+'</span><span>'+esc(custById(x.job.customerId).name)+'</span><span>'+esc(STATUS_STEPS[x.job.statusIndex])+'</span>'
      : '<span class="ds-mono">'+x.inq.id+'</span><span>'+esc(x.inq.assignedTo)+'</span>';
    const href = x.job ? "go('#/jobs/"+x.job.id+"')" : "go('#/inquiries/"+x.inq.id+"')";
    return '<li class="ds-queue__item" data-tone="'+x.tone+'" style="--i:'+i+'"><span class="ds-queue__icon">'+icon(x.icon)+'</span>'+

function workloadPanel(jobs){
  const w = {};
  jobs.forEach(j=>j.tasks.forEach(t=>{ if(!t.done){ w[t.owner] = w[t.owner]||{open:0,overdue:0}; w[t.owner].open++; if(taskStatus(j,t)==='Overdue') w[t.owner].overdue++; } }));

function taskSections(list){

}

/* ============================== SHIPMENTS LIST ==============================
   Columns answer, in order: which job, where is it, is it OK, what happens next, and how long before
   fees start. "Next step" is the column that makes the list something you can work from. */
function jobMatchesFilter(j, f){
  const h = jobHealth(j);
  if(f==='closed') return j.statusIndex===8;
  if(j.statusIndex===8) return false;
  if(f==='blocked') return h.tone==='danger';
  if(f==='attention') return h.tone==='warning';
  if(f==='clock'){ const c = deadlineInfo(j); return !!(c && c.days!=null && c.days<=2); }
  if(f==='funds') return canSeeFunds() && !!fundingGap(j);
  return true;
}
function renderJobsList(){
  const base = JOBS.filter(canSeeJob);
  const q = STATE.jobQuery.trim().toLowerCase();
  const f = STATE.jobFilter, st = STATE.jobStage;
  const rows = base.filter(j=>jobMatchesFilter(j, st===8 ? 'closed' : f) && (st==null || j.statusIndex===st) &&
    (!q || [j.id, j.containerNo, j.blNo, custById(j.customerId).name, j.consignee].some(v=>String(v).toLowerCase().includes(q))));
  const count = k => base.filter(j=>jobMatchesFilter(j,k)).length;
  const chip = (k,label,tone)=>'<button class="ds-chip'+(tone?' ds-chip--'+tone:'')+'" aria-pressed="'+(f===k && st==null)+'" onclick="STATE.jobFilter=\''+k+'\'; STATE.jobStage=null; render()">'+label+'<span class="ds-chip__count">'+count(k)+'</span></button>';
  const stageOpts = '<option value="">All stages</option>'+STATUS_STEPS.map((s,i)=>'<option value="'+i+'"'+(st===i?' selected':'')+'>'+(i+1)+'. '+s+' ('+base.filter(j=>j.statusIndex===i).length+')</option>').join('');
  const body = rows.map(j=>{
    const c = custById(j.customerId), n = nextStep(j), clk = deadlineInfo(j);
    const clkHtml = clk && clk.days!=null ? '<span class="'+(clk.days<0?'ds-overdue':clk.days<=2?'ds-strong':'ds-muted')+'" style="'+(clk.days>=0&&clk.days<=2?'color:var(--t1m-warning)':'')+'">'+icon('clock')+' '+esc(clockText(clk))+'</span>' : '<span class="ds-muted3">—</span>';
    return '<tr data-href onclick="go(\'#/jobs/'+j.id+'\')">'+

        '<div class="ds-row"><div class="ds-search" style="flex:1;min-width:220px;max-width:420px">'+icon('search')+'<input class="ds-input" id="job-search" placeholder="Job, container, BL, customer or consignee" value="'+esc(STATE.jobQuery)+'" oninput="STATE.jobQuery=this.value; render()"></div>'+

/* ============================== SHIPMENT 360 ==============================
   Top to bottom: who and where (header), how far (journey), WHAT NOW (next step, the hero), the
   clocks that cost money, then the record itself in tabs. The work is above the fold; the archive
   is below it. */
function journeyHtml(j){
  const blocked = isOnHold(j) || !!customsHold(j);
  return '<ol class="ds-track ds-track--compact" id="journey" aria-label="Journey">'+STATUS_STEPS.map((s,idx)=>{
    const state = idx<j.statusIndex || j.statusIndex===8 ? 'done' : idx===j.statusIndex ? (blocked?'blocked':'current') : '';
    const just = STATE.justAdvanced && STATE.justAdvanced.id===j.id && STATE.justAdvanced.idx===idx;
    const sub = s===CUSTOMS_PHASE ? '<span class="ds-track__sub" aria-label="Customs step '+((j.customs?j.customs.subIndex:0)+(idx<j.statusIndex?7:1))+' of 7">'+CUSTOMS_SUBSTAGES.map((x,k)=>'<i'+((idx<j.statusIndex)||(idx===j.statusIndex && j.customs && k<=j.customs.subIndex)?' data-on':'')+'></i>').join('')+'</span>' : '';
    return '<li class="ds-track__step" data-state="'+state+'"'+(just?' data-just':'')+' title="'+esc(STAGE_HINT[idx])+'">'+esc(s)+sub+'</li>';
  }).join('')+'</ol>';
}
function gateItemHtml(it){
  const ic = it.met ? 'check' : it.blocked ? 'lock' : 'circle';
  return '<li class="ds-gate__item"'+(it.met?' data-met':'')+(it.blocked?' data-blocked':'')+'>'+icon(ic)+
    '<div class="ds-gate__label">'+esc(it.label)+(it.sub?'<small'+(it.overdue?' class="ds-overdue"':'')+'>'+esc(it.sub)+'</small>':'')+'</div>'+
    (it.act?'<button class="ds-btn ds-btn--secondary ds-btn--sm" onclick="'+it.act.js+'">'+(it.act.icon?icon(it.act.icon):'')+esc(it.act.label)+'</button>':'<span></span>')+'</li>';
}
function customsStrip(j){
  if(STATUS_STEPS[j.statusIndex]!==CUSTOMS_PHASE || !j.customs) return '';
  const c = j.customs;
  return '<div class="ds-row" style="gap:var(--t1m-space-2) var(--t1m-space-4)">'+
    '<span class="ds-small">'+icon('shield')+' Customs step <strong>'+(c.subIndex+1)+' of 7</strong>: '+esc(CUSTOMS_SUBSTAGES[c.subIndex])+'</span>'+
    '<span class="ds-row ds-row--tight">'+pill('Lane '+c.lane, LANE_TONE[c.lane], c.lane==='Green'?'check':'alert')+'<span class="ds-muted ds-xs">'+esc(LANE_MEANING[c.lane])+'</span>'+
    (isManagerLike()?'<button class="ds-link ds-small" onclick="openLane(\''+j.id+'\')">Change</button>':'')+'</span>'+
    (CUSTOMS_SUBSTAGES[c.subIndex]==='Payment Pending' && c.paymentParty ? pill('Waiting on '+(c.paymentParty==='Client'?'the client':'Top1Movers'), c.paymentParty==='Client'?'warning':'info','clock') : '')+
  '</div>';
}
function nextStepHtml(j){
  const n = nextStep(j);
  const enter = STATE.justNext===j.id ? ' ds-next--enter' : '';
  const items = (n.items||[]);
  const override = isManagerLike() && j.statusIndex<8 ? '<button class="ds-btn ds-btn--ghost ds-btn--sm" id="override-btn" onclick="openOverride(\''+j.id+'\')" title="Move out of the normal order, with a logged reason">Override…</button>' : '';
  return '<section class="ds-next ds-next--'+n.tone+enter+'" id="next-step" aria-live="polite">'+
    '<div class="ds-next__head"><span class="ds-next__icon">'+icon(n.icon)+'</span><div><div class="ds-next__eyebrow">'+esc(n.eyebrow)+'</div><h2 class="ds-next__title">'+esc(n.title)+'</h2><p class="ds-next__text">'+esc(n.text)+'</p></div></div>'+
    ((items.length || customsStrip(j)) ? '<div class="ds-next__body">'+customsStrip(j)+
      (items.length?'<div><div class="ds-gate__title"><span>'+esc(n.gateTitle||'Checklist')+'</span><span>'+items.filter(i=>i.met).length+' of '+items.length+' done</span></div><ul class="ds-gate" id="gate">'+items.map(gateItemHtml).join('')+'</ul></div>':'')+'</div>' : '')+
    '<div class="ds-next__foot"><div class="ds-next__who">'+(n.who?icon('user')+esc(n.who):(n.locked?icon('lock')+'<span>'+esc(n.locked)+' unlocks when the list is done.</span>':''))+'</div>'+
      '<div class="ds-next__actions">'+override+(n.primary?'<button class="ds-btn ds-btn--primary" id="next-primary" onclick="'+n.primary.js+'">'+(n.primary.icon?icon(n.primary.icon):'')+esc(n.primary.label)+'</button>':'')+'</div></div>'+
  '</section>';
}
function clockPanel(j){
  const c = deadlineInfo(j);
  if(!c || c.days==null) return '';
  const tone = clockTone(c.days), pct = Math.max(0, Math.min(100, c.days/FREE_WINDOW_DAYS*100));
  const expl = c.type==='storage' ? 'The port charges storage every day after this date. Clearing customs is what stops it.' : 'The shipping line charges for its container every day after this date until the empty is returned.';
  return '<section class="ds-panel ds-panel--elevated" id="fee-clock"><div class="ds-panel__head"><h3>'+icon('clock')+esc(c.label)+'</h3>'+pill(tone==='danger'?'Fees running':tone==='warning'?'Ending soon':'On time', tone==='neutral'?'success':tone, tone==='neutral'?'check':'clock','ds-pill--sm')+'</div>'+
    '<div class="ds-panel__body"><div class="ds-clock ds-clock--'+tone+'"><div class="ds-clock__row"><span class="ds-clock__days">'+(c.days<0?Math.abs(c.days):c.days)+'<small>'+(c.days<0?'days of fees so far':'free day'+(c.days===1?'':'s')+' left')+'</small></span></div>'+
    '<span class="ds-bar-track"><span class="ds-bar-fill'+(tone==='neutral'?' ds-bar-fill--success':' ds-bar-fill--'+tone)+'" style="width:'+(c.days<0?100:pct)+'%"></span></span>'+
    '<p class="ds-muted ds-xs">'+(c.days<0?'Free time ended ':'Free until ')+esc(c.deadline)+'. '+esc(expl)+'</p></div></div></section>';
}
function factsPanel(j){
  const c = custById(j.customerId);

    f('Customer', can('Customer Mgmt')?'<a class="ds-link" href="#/customers/'+c.id+'">'+esc(c.name)+'</a>':esc(c.name))+

    f('Crew', esc(crewFor(j)))+
    f('Container', '<span class="ds-mono">'+esc(j.containerNo)+'</span>')+
    f('Bill of lading', '<span class="ds-mono">'+esc(j.blNo)+'</span>')+

    f(j.statusIndex<3?'ETA':'Arrived', esc(j.eta))+
