const TAB_LABELS = { tasks:'Tasks', documents:'Documents', exceptions:'Exceptions', delivery:'Delivery', money:'Money', details:'Details', history:'History' };
function jobTabs(j){
  const tabs = ['tasks','documents','exceptions','delivery'];
  if(canSeeFunds()) tabs.push('money');
  tabs.push('details','history');
  return tabs.filter(t=>t!=='documents' || can('Document Mgmt') || isFinance()).filter(t=>t!=='exceptions' || can('Exceptions & Approval') || isFinance());
}
function tabCount(j, t){
  if(t==='tasks'){ const n = j.tasks.filter(x=>['Overdue','To do'].includes(taskStatus(j,x)) && (!isCrew()||x.owner===CURRENT_USER.name)).length; const od = j.tasks.some(x=>taskStatus(j,x)==='Overdue'); return n ? '<span class="ds-tab__count'+(od?' ds-tab__count--danger':'')+'">'+n+'</span>' : ''; }
  if(t==='documents'){ const n = j.documents.filter(d=>d.status!=='Approved' && (docsDue(j)||d.status!=='Missing')).length; return n ? '<span class="ds-tab__count ds-tab__count--warning">'+n+'</span>' : ''; }
  if(t==='exceptions'){ const n = j.exceptions.filter(e=>e.status==='Pending Approval').length; return n ? '<span class="ds-tab__count ds-tab__count--danger">'+n+'</span>' : ''; }
  if(t==='money' && canSeeFunds()){ const n = (fundingGap(j)?1:0) + j.charges.filter(isUnresolved).length; return n ? '<span class="ds-tab__count ds-tab__count--warning">'+n+'</span>' : ''; }
  return '';
}
function renderJob(id, tab){
  const j = jobById(id);
  if(!j) return '<div class="ds-panel ds-panel--elevated">'+emptyState('search','Job not found','Check the job number, or search for it with Ctrl K.','<a class="ds-btn ds-btn--secondary" href="#/jobs">All shipments</a>')+'</div>';
  if(!canSeeJob(j)) return accessDenied('Shipments', j.id+' is not assigned to you. Warehouse Crew only see jobs they have tasks on.');
  const c = custById(j.customerId);
  const tabs = jobTabs(j);
  const n = nextStep(j);
  const active = tabs.includes(tab) ? tab : (tabs.includes(n.tab) ? n.tab : 'tasks');
  const body = { tasks:jobTasksTab, documents:jobDocumentsTab, exceptions:jobExceptionsTab, delivery:jobDeliveryTab, money:jobMoneyTab, details:jobDetailsTab, history:jobHistoryTab }[active](j);
  const menu = [];
  if(canRaiseException() && j.statusIndex<8) menu.push('<button onclick="closePopover(); openRaiseException(\''+id+'\')">'+icon('flag')+'Raise an exception</button>');
  if(isManagerLike() && STATUS_STEPS[j.statusIndex]===CUSTOMS_PHASE) menu.push(customsHold(j) ? '<button onclick="closePopover(); clearCustomsHold(\''+id+'\')">'+icon('check')+'Clear customs hold</button>' : '<button onclick="closePopover(); openPlaceHold(\''+id+'\')">'+icon('lock')+'Place customs hold</button>', '<button onclick="closePopover(); openLane(\''+id+'\')">'+icon('shield')+'Set customs lane</button>');
  if(isManagerLike() && j.statusIndex<8) menu.push('<button onclick="closePopover(); openOverride(\''+id+'\')">'+icon('alert')+'Override stage…</button>');
  menu.push('<a href="#/track/'+id+'" onclick="closePopover()">'+icon('eye')+'Open the client tracking page</a>');
  if(canSeeFunds() && j.statusIndex>=7) menu.push('<a href="#/jobs/'+id+'/billing-summary" onclick="closePopover()">'+icon('file')+'Billing Summary</a>');
  JOB_MENU = menu.join('');
  return '<nav class="ds-crumbs"><a href="#/jobs">'+(isCrew()?'My shipments':'Shipments')+'</a>'+icon('chevron-right')+'<span class="ds-mono">'+j.id+'</span></nav>'+
    '<header class="ds-jobhead"><div><h1>'+j.id+' '+healthPill(j)+'</h1>'+
      '<div class="ds-jobhead__line"><strong class="ds-strong">'+esc(c.name)+'</strong><span class="ds-routeline">'+esc(j.origin)+icon('arrow-right')+esc(j.portOfEntry)+icon('arrow-right')+esc(j.destination)+'</span><span>'+esc(j.commodity)+'</span></div></div>'+
      '<div class="ds-jobhead__actions">'+stagePill(j)+'<button class="ds-btn ds-btn--secondary" id="job-more" onclick="event.stopPropagation(); showPopover(this, JOB_MENU)" aria-haspopup="true">'+icon('more')+'More</button></div></header>'+
    '<div class="ds-stack">'+
      '<section class="ds-panel ds-panel--elevated"><div class="ds-panel__body">'+journeyHtml(j)+'</div></section>'+
      '<div class="ds-split">'+nextStepHtml(j)+'<div class="ds-stack">'+clockPanel(j)+factsPanel(j)+'</div></div>'+
      '<section class="ds-panel ds-panel--elevated" id="job-tabs"><div class="ds-tabs" role="tablist">'+tabs.map(t=>'<button class="ds-tab" role="tab" aria-selected="'+(t===active)+'" onclick="go(\'#/jobs/'+id+'/'+t+'\')"><span class="ds-tab__label" data-text="'+TAB_LABELS[t]+'">'+TAB_LABELS[t]+'</span>'+tabCount(j,t)+'</button>').join('')+'</div>'+
        '<div class="ds-panel__body" id="tab-body">'+body+'</div></section>'+
    '</div>';
}
let JOB_MENU = '';

/* ---------- Tasks tab ---------- */
function jobTasksTab(j){
  const mine = isCrew();
  const list = mine ? j.tasks.filter(t=>t.owner===CURRENT_USER.name) : j.tasks;
  const rows = list.map(t=>{
    const st = taskStatus(j,t);
    let actions = '';
    if(!t.done){
      if(canCompleteTask(t)) actions += t.via==='delivery' ? (canConfirmDelivery() && j.statusIndex===5 ? '<button class="ds-btn ds-btn--secondary ds-btn--sm" onclick="openConfirmDelivery(\''+j.id+'\')">Confirm delivery</button>' : '<span class="ds-muted ds-xs">Done by confirming delivery</span>')
        : '<button class="ds-btn ds-btn--'+(st==='Upcoming'?'ghost':'secondary')+' ds-btn--sm" onclick="openCompleteTask(\''+j.id+'\',\''+t.id+'\')">'+(st==='Upcoming'?'Complete early':'Complete')+'</button>';
      if(canReassign()) actions += ' <button class="ds-btn ds-btn--ghost ds-btn--sm" onclick="openReassignTask(\''+j.id+'\',\''+t.id+'\')">Reassign</button>';
    } else if(t.evidenceFile || t.note) actions = '<button class="ds-btn ds-btn--ghost ds-btn--sm" onclick="openTaskProof(\''+j.id+'\',\''+t.id+'\')">'+icon('file')+'View proof</button>';
    return '<tr><td data-label="Task" class="ds-col-main"><span class="ds-cell-name"><span class="ds-strong">'+esc(t.name)+'</span><span class="ds-cell-sub">'+[t.requiresEvidence?'Needs proof to complete':'', t.corrective?'Fix for an approved exception':'', t.detention?'Stops the detention clock':'', t.done?'Done by '+(t.doneBy||t.owner):''].filter(Boolean).join(' · ')+'</span></span></td>'+
      '<td data-label="Owner"><span class="ds-row ds-row--tight">'+avatar(t.owner,true)+esc(t.owner)+'</span></td>'+
      '<td data-label="Due" class="'+(st==='Overdue'?'ds-overdue':'')+'">'+esc(t.done?'—':shortDate(t.due))+'</td>'+
      '<td data-label="Status">'+pill(st, TASK_TONE[st], TASK_ICON[st])+'</td><td data-label="" class="ds-num">'+actions+'</td></tr>';
  }).join('');
  return '<p class="ds-muted ds-small" style="margin-bottom:var(--t1m-space-3)">'+(mine?'Your tasks on this job. ':'')+'Tasks become <strong>To do</strong> when the job reaches their step, and turn <strong>Overdue</strong> the day after their due date, which emails the owner.</p>'+
    '<div class="ds-table-wrap" style="margin:0 calc(var(--t1m-space-4) * -1)"><table class="ds-table ds-table--stack" id="tasks-table"><thead><tr><th>Task</th><th>Owner</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>'+
    (rows || '<tr><td colspan="5" class="ds-muted">No tasks assigned to you on this job.</td></tr>')+'</tbody></table></div>';
}
function openCompleteTask(jobId, taskId){
  const j = jobById(jobId), t = j.tasks.find(x=>x.id===taskId);
  if(t.via==='delivery'){ openConfirmDelivery(jobId); return; }
  if(!canCompleteTask(t)){ showToast('Only '+t.owner+' or a coordinator can complete this task.', 'danger', 'lock'); return; }
  const gap = t.money ? fundingGap(j) : null;
  const blockMoney = gap ? '<div class="ds-alert ds-alert--danger" id="complete-blocked">'+icon('wallet')+'<div><strong>Not enough client funds to pay this</strong>'+esc(gap.text)+' '+(canManageFunds()?'Record the client’s deposit first.':'A Manager records the client’s deposit first.')+
    (canManageFunds()?'<div class="ds-alert__actions"><button type="button" class="ds-btn ds-btn--secondary ds-btn--sm" onclick="openAddFunds(\''+jobId+'\')">'+icon('wallet')+'Add funds received</button></div>':'')+'</div></div>' : '';
  openDrawer({ title:'Complete task', sub:esc(t.name)+' · <span class="ds-mono">'+j.id+'</span>',
    body:'<form class="ds-stack--sm" id="complete-form" onsubmit="event.preventDefault(); completeTask(\''+jobId+'\',\''+taskId+'\', this)">'+blockMoney+
      (t.requiresEvidence ? '<div class="ds-field"><label>Proof of completion</label>'+uploadHtml('taskEvidence', t.name==='Lodge customs entry'?'The lodged entry or BOC acknowledgement':t.money?'The duty payment receipt':'A file that shows it was done')+errorSlot('evidence')+'<p class="ds-field__hint">This task cannot be marked done without a file. That is what makes the record trustworthy later.</p></div>' : '<p class="ds-muted ds-small">No proof needed for this task.</p>')+
      '<div class="ds-field"><label for="task-note">Note <span class="ds-opt">optional</span></label><textarea class="ds-textarea" id="task-note" name="note" placeholder="Anything the next person should know"></textarea></div></form>',
    foot: drawerFoot('Mark done','complete-form',{icon:'check'}) });
  if(gap){ const b = document.querySelector('#drawerRoot button[type=submit]'); b.disabled = true; b.title = 'Record the client deposit first'; }
}
function completeTask(jobId, taskId, form){
  const j = jobById(jobId), t = j.tasks.find(x=>x.id===taskId);
  if(t.money && fundingGap(j)){ showToast('Record the client’s deposit before paying.', 'danger', 'wallet'); return; }
  if(t.requiresEvidence && !UPLOADS.taskEvidence){ fieldError(form,'evidence','Attach the completion evidence first. This task needs proof.'); return; }
  const note = String(new FormData(form).get('note')||'').trim();
  t.done = true; t.note = note||null; t.evidenceFile = UPLOADS.taskEvidence||null; t.doneBy = CURRENT_USER.name; t.doneOn = todayDMY();
  if(t.money){ j.charges.filter(c=>c.dueDate && !c.paidDate && isReimbursable(c)).forEach(c=>{ c.paidDate = todayDMY(); c.dueDate = null; if(!c.evidence) c.evidence = UPLOADS.taskEvidence||null; }); }
  log(j, 'Task completed', t.name+(t.evidenceFile?' (proof: '+t.evidenceFile+')':'')+'.');
  closeDrawer();
  STATE.justNext = j.id;
  showToast(t.name+' done.', 'success', 'check');
  render();
}
function openReassignTask(jobId, taskId){
  const j = jobById(jobId), t = j.tasks.find(x=>x.id===taskId);
  const people = USERS.filter(u=>u.active && ['Dispatcher','Warehouse Crew','Manager'].includes(u.role)).map(u=>({ value:u.name, label:u.name+' · '+u.role }));
  const quick = [['Today',0],['Tomorrow',1],['In 3 days',3]].map(([l,n])=>'<button type="button" class="ds-chip" onclick="document.getElementById(\'ra-due\').value=\''+dmyToISO(addDaysDMY(n))+'\'">'+l+'</button>').join('');
  const cur = userByName(t.owner);
  openDrawer({ title:'Reassign task', sub:esc(t.name)+' · <span class="ds-mono">'+j.id+'</span>',
    body:'<form class="ds-stack--sm" id="reassign-form" onsubmit="event.preventDefault(); saveReassign(\''+jobId+'\',\''+taskId+'\', this)">'+
      (cur && !cur.active ? '<div class="ds-alert ds-alert--warning">'+icon('alert')+'<div><strong>'+esc(t.owner)+' is deactivated</strong>This task needs a new owner.</div></div>' : '')+
      '<div class="ds-field"><label for="ra-owner">New owner</label>'+selectWrap('<select class="ds-select" id="ra-owner" name="owner">'+options(people, t.owner)+'</select>')+'</div>'+
      '<div class="ds-field"><label for="ra-due">Due date</label><input class="ds-input" type="date" id="ra-due" name="due" value="'+dmyToISO(t.due||todayDMY())+'">'+errorSlot('due')+'<div class="ds-chips" style="margin-top:6px">'+quick+'</div></div></form>',
    foot: drawerFoot('Reassign','reassign-form',{icon:'user'}) });
}
function saveReassign(jobId, taskId, form){
  const j = jobById(jobId), t = j.tasks.find(x=>x.id===taskId), fd = new FormData(form);
  const due = isoToDMY(fd.get('due'));
  if(!due){ fieldError(form,'due','Pick a due date.'); return; }
  const from = t.owner; t.owner = fd.get('owner'); t.due = due;
  log(j, 'Task reassigned', t.name+': '+from+' → '+t.owner+', due '+due+'.');
  closeDrawer(); showToast(t.name+' now with '+t.owner+'.', 'info', 'user'); render();

      '<div class="ds-field"><label for="rex-task">The fix</label><input class="ds-input" id="rex-task" name="task" value="'+esc(CORRECTIVE_FOR[e.category]||'Corrective action')+'">'+errorSlot('task')+'</div>'+

    foot:'<button type="button" class="ds-btn ds-btn--ghost" onclick="closeDrawer()">Cancel</button><button type="button" class="ds-btn ds-btn--secondary" onclick="rejectException(\''+jobId+'\',\''+exId+'\')">'+icon('x')+'Reject</button><button type="submit" form="rex-form" class="ds-btn ds-btn--primary" id="approve-ex">'+icon('check')+'Approve &amp; assign fix</button>' });

function approveException(jobId, exId, form){
  const j = jobById(jobId), e = j.exceptions.find(x=>x.id===exId), fd = new FormData(form);
  const task = String(fd.get('task')||'').trim(), due = isoToDMY(fd.get('due'));
  if(fieldError(form,'task', task?'':'Name the fix.') | fieldError(form,'due', due?'':'Pick the date the fix is due.')) return;
  const t = { id:'T'+(j.tasks.length+1), name:task, owner:fd.get('owner'), due, done:false, requiresEvidence:true, corrective:true, flat:null, note:null };
  j.tasks.push(t);
  e.status='Approved'; e.correctiveTaskId = t.id; e.decisionNote = String(fd.get('note')||'').trim()||null; e.decidedBy = CURRENT_USER.name;
  log(j, 'Exception approved', e.category+' approved. Fix "'+task+'" assigned to '+t.owner+', due '+due+'.');
  closeDrawer(); STATE.justNext = j.id; showToast('Exception approved. '+t.owner+' has the fix on their list.', 'success', 'check'); render();
}
function rejectException(jobId, exId){

  const j = jobById(jobId), e = j.exceptions.find(x=>x.id===exId);
  e.status='Rejected'; e.decisionNote = note; e.decidedBy = CURRENT_USER.name;
  log(j, 'Exception rejected', e.category+' rejected: '+note);
  closeDrawer(); STATE.justNext = j.id; showToast('Exception rejected. The job is unfrozen.', 'info', 'x'); render();
}

function confirmDelivery(jobId, form){
  const j = jobById(jobId), fd = new FormData(form);
  const receiver = String(fd.get('receiver')||'').trim(), damage = fd.get('damage')==='on';
  const bad = fieldError(form,'receiver', receiver?'':'Enter who received the goods.') | fieldError(form,'pod', UPLOADS.podFile?'':'Attach the proof of delivery.');
  if(bad) return;
  j.delivery = { confirmed:true, date:isoToDMY(fd.get('date'))||todayDMY(), receiver, damage, damageNote: damage ? (String(fd.get('damageNote')||'').trim()||'Damage reported.') : null, podFile:UPLOADS.podFile };
  const t = j.tasks.find(x=>x.via==='delivery'); if(t){ t.done = true; t.doneBy = CURRENT_USER.name; t.doneOn = todayDMY(); t.evidenceFile = UPLOADS.podFile; }
  j.statusIndex = 6;
  log(j, 'Delivery confirmed', (damage?'Delivered with reported damage. ':'Delivered in full. ')+'Received by '+receiver+'. POD '+UPLOADS.podFile+'.');
  STATE.justAdvanced = { id:j.id, idx:6 }; STATE.justNext = j.id;
  closeDrawer(); showToast(damage ? 'Delivery confirmed, damage reported.' : 'Delivery confirmed in full.', damage?'warning':'success', damage?'alert':'check');
  render();
}

/* ---------- Stage moves ---------- */
function advanceStage(id){
  const j = jobById(id), g = stageGate(j), n = nextStep(j);
  if(isOnHold(j) || customsHold(j)){ showToast('This job is frozen. Resolve the block first.', 'danger', 'lock'); return; }
  if(!g || g.items.some(i=>!i.met)){ showToast('Finish the checklist first: '+(g.items.find(i=>!i.met)||{}).label, 'danger', 'lock'); return; }
  if(g.managerOnly ? !isManagerLike() : !canMoveStage()){ showToast('Your role cannot move this job on.', 'danger', 'lock'); return; }
  if(j.statusIndex===4 && j.customs && j.customs.subIndex<CUSTOMS_SUBSTAGES.length-1){ showToast('Finish the customs steps first.', 'danger', 'lock'); return; }
  j.statusIndex++;
  const to = STATUS_STEPS[j.statusIndex];
  if(to===CUSTOMS_PHASE && !j.customs) j.customs = { subIndex:0, lane:'Green', hold:null, paymentParty:null };
  if(to==='Arrived at Port' && !j.storageDeadline) j.storageDeadline = addDaysDMY(5);
  if(to==='Out for Delivery' && !j.detentionDeadline) j.detentionDeadline = addDaysDMY(5);
  if(to==='Arrived at Port') j.eta = todayDMY();
  log(j, to==='Closed'?'Job closed':'Stage changed', 'Moved to '+to+'.');
  STATE.justAdvanced = { id, idx:j.statusIndex }; STATE.justNext = id;
  showToast(j.id+' moved to '+to+'.', 'success', 'arrow-right');
  render();
}
function openAdvanceCustoms(id){
  const j = jobById(id);
  openDrawer({ title:'Mark as Payment Pending', sub:'<span class="ds-mono">'+j.id+'</span> · customs has stated the duty',
    body:'<form class="ds-stack--sm" id="party-form" onsubmit="event.preventDefault(); advanceCustoms(\''+id+'\', new FormData(this).get(\'party\'))">'+
      '<p>Who pays the duty? The job page will show whose move it is, so nobody has to ask.</p>'+
      '<label class="ds-check"><input type="radio" name="party" value="Top1Movers" checked> <span><strong class="ds-strong">Top1Movers pays</strong><br><span class="ds-muted ds-xs">From the client’s deposit, then bills back</span></span></label>'+
      '<label class="ds-check"><input type="radio" name="party" value="Client"> <span><strong class="ds-strong">Waiting for the client</strong><br><span class="ds-muted ds-xs">The client must release funds or pay customs directly</span></span></label></form>',
    foot: drawerFoot('Mark as Payment Pending','party-form',{icon:'arrow-right'}) });
}
function advanceCustoms(id, party){
  const j = jobById(id);
  if(customsHold(j) || isOnHold(j)){ showToast('Customs steps are frozen by a hold or an exception.', 'danger', 'lock'); return; }
  const g = stageGate(j);
  if(g.items.some(i=>!i.met)){ showToast('Finish the checklist first.', 'danger', 'lock'); return; }
  j.customs.subIndex++;
  const to = CUSTOMS_SUBSTAGES[j.customs.subIndex];
  if(to==='Payment Pending') j.customs.paymentParty = party||'Top1Movers';
  log(j, 'Customs step', 'Moved to '+to+(to==='Payment Pending'?' (waiting on '+j.customs.paymentParty+')':'')+'.');
  STATE.justNext = id;
  closeDrawer(); STATE.justNext = id;
  showToast('Customs: '+to+'.', 'success', 'shield'); render();
}
/* Proof the client paid the duty: reuse the slip from a deposit recorded while we waited on
   the client (Add funds received), otherwise ask for one here. Earlier deposits don't count. */
function dutyDepositOnFile(j){ return j.fundsReceived.filter(f=>f.forDuty && f.evidence).slice(-1)[0] || null; }
function openConfirmClientPaid(id){
  const j = jobById(id), c = custById(j.customerId), onFile = dutyDepositOnFile(j);
  const duty = j.charges.filter(x=>x.dueDate && !x.paidDate && isReimbursable(x));
  const dutyRow = canSeeFunds() && duty.length ? '<dt>Duty due</dt><dd>'+money(sumOf(duty, x=>x.amount))+'</dd>' : '';
  const proof = onFile
    ? '<div class="ds-field"><label>Proof of payment</label><div class="ds-upload" data-filled="true"><div class="ds-upload__file">'+icon('file')+'<span>'+esc(onFile.evidence)+'</span></div></div><p class="ds-field__hint">Deposit slip already on file: '+(canSeeFunds()?money(onFile.amount)+', ':'')+'received '+esc(onFile.date)+'.</p></div>'
    : '<div class="ds-field"><label>Proof of payment</label>'+uploadHtml('clientPaidProof','Bank slip or transfer confirmation from the client')+errorSlot('proof')+'<p class="ds-field__hint">Needed to confirm. It stays on the job’s record.</p></div>';
  openDrawer({ title:'Confirm client payment', sub:'<span class="ds-mono">'+j.id+'</span> · '+esc(c.name),
    body:'<form class="ds-stack--sm" id="client-paid-form" onsubmit="event.preventDefault(); setPaymentParty(\''+id+'\',\'Top1Movers\', this)">'+
      '<div class="ds-alert ds-alert--warning">'+icon('alert')+'<div><strong>Only confirm once the money is in</strong>This tells the team the client has released the duty payment, and Top1Movers goes ahead and pays customs.</div></div>'+
      '<dl class="ds-facts"><dt>Customer</dt><dd>'+esc(c.name)+'</dd><dt>Contact</dt><dd>'+esc(c.contact.name)+'</dd>'+dutyRow+'</dl>'+proof+
      '<div class="ds-field"><label for="paid-note">How was it confirmed? <span class="ds-opt">optional</span></label><textarea class="ds-textarea" id="paid-note" name="note" placeholder="e.g. Bank transfer slip received by email"></textarea></div></form>',
    foot: drawerFoot('Yes, client has paid','client-paid-form',{icon:'check'}) });
}
function setPaymentParty(id, party, form){
  const j = jobById(id);
  let proofFile = null;
  if(form){
    const onFile = dutyDepositOnFile(j);
    proofFile = onFile ? onFile.evidence : UPLOADS.clientPaidProof;
    if(fieldError(form,'proof', proofFile?'':'Attach the client’s proof of payment first.')) return;
  }
  j.customs.paymentParty = party;
  if(proofFile) j.customs.paymentProof = proofFile;
  const note = form ? String(new FormData(form).get('note')||'').trim() : '';
  log(j, 'Customs step', (party==='Top1Movers'?'Client released the duty payment. Top1Movers to pay.':'Waiting on the client.')+(proofFile?' (proof: '+proofFile+')':'')+(note?' '+note:''));
  closeDrawer();
  STATE.justNext = id; showToast('Recorded: the client has released payment.', 'success', 'check'); render();
}

function saveLane(id, lane){ const j = jobById(id); j.customs.lane = lane; log(j, 'Customs lane set', 'Lane '+lane+'.'); closeDrawer(); showToast('Customs lane set to '+lane+'.', 'info', 'shield'); render(); }
function openPlaceHold(id){
  const j = jobById(id);
  openDrawer({ title:'Place customs hold', sub:'<span class="ds-mono">'+j.id+'</span> · freezes the customs steps',
    body:'<form class="ds-stack--sm" id="hold-form" onsubmit="event.preventDefault(); savePlaceHold(\''+id+'\', this)">'+

function savePlaceHold(id, form){
  const fd = new FormData(form), note = String(fd.get('note')||'').trim();
  if(!note){ fieldError(form,'note','Say what customs is waiting on.'); return; }
  const j = jobById(id); j.customs.hold = { type:fd.get('type'), note, by:CURRENT_USER.name, on:todayDMY() };
  log(j, 'Customs hold placed', j.customs.hold.type+': '+note);
  closeDrawer(); STATE.justNext = id; showToast('Customs hold placed on '+j.id+'.', 'warning', 'lock'); render();
}
function clearCustomsHold(id){
  if(!isManagerLike()){ showToast('Only a Manager or Admin can clear a customs hold.', 'danger', 'lock'); return; }
  const j = jobById(id); const h = j.customs.hold;
  log(j, 'Customs hold cleared', (h?h.type:'Hold')+' cleared.');
  j.customs.hold = null; STATE.justNext = id;
  showToast('Hold cleared. Customs steps can continue.', 'success', 'check'); render();
}
function openOverride(id){
  const j = jobById(id);
  const opts = [];
  STATUS_STEPS.forEach((s,i)=>{ if(s===CUSTOMS_PHASE) CUSTOMS_SUBSTAGES.forEach((c,k)=>opts.push({ value:i+':'+k, label:'Customs Clearance · '+c })); else opts.push({ value:i+':', label:s }); });
  const cur = j.statusIndex+':'+(STATUS_STEPS[j.statusIndex]===CUSTOMS_PHASE?j.customs.subIndex:'');
  openDrawer({ title:'Override stage', sub:'<span class="ds-mono">'+j.id+'</span> · Manager / Admin only',
    body:'<form class="ds-stack--sm" id="ov-form" onsubmit="event.preventDefault(); commitOverride(\''+id+'\', this)">'+
      '<div class="ds-alert ds-alert--warning">'+icon('alert')+'<div><strong>Skips the checklist</strong>Real jobs are not always in order (customs is often filed before the ship arrives). Use it when that happens. The reason is written to the audit trail with your name.</div></div>'+
      '<div class="ds-field"><label for="ov-to">Move to</label>'+selectWrap('<select class="ds-select" id="ov-to" name="to">'+options(opts, cur)+'</select>')+'</div>'+
      '<div class="ds-field"><label for="ov-reason">Reason</label><textarea class="ds-textarea" id="ov-reason" name="reason" placeholder="Why is this job leaving the normal order?"></textarea>'+errorSlot('reason')+'</div></form>',
    foot: drawerFoot('Override','ov-form',{icon:'alert', danger:true}) });
}
function commitOverride(id, form){
  const fd = new FormData(form), reason = String(fd.get('reason')||'').trim();
  if(!reason){ fieldError(form,'reason','A reason is required for an override.'); return; }
  const j = jobById(id), [si, sub] = String(fd.get('to')).split(':');
  j.statusIndex = +si;
  if(STATUS_STEPS[j.statusIndex]===CUSTOMS_PHASE){ if(!j.customs) j.customs = { subIndex:0, lane:'Green', hold:null, paymentParty:null }; j.customs.subIndex = +sub; }
  const label = STATUS_STEPS[j.statusIndex]+(sub!==''?' · '+CUSTOMS_SUBSTAGES[+sub]:'');
  log(j, 'Stage override', 'Forced to '+label+'. Reason: '+reason);
  closeDrawer(); STATE.justNext = id; showToast('Overridden to '+label+'. Logged.', 'warning', 'alert'); render();
}

/* ============================== MONEY TAB ==============================
   One question per block: Is there enough client money for what is due? (shortfall banner) · Where
   did the client's money go? (notebook) · What is not agreed yet? (extra charges) · What do we
   bill? (charges) · Did we make money? (margin) · Can Finance have it? (checklist). */
function stat(label, value, danger, sub){ return '<div class="ds-stat"><div class="ds-label">'+esc(label)+'</div><div class="ds-stat__value'+(danger?' ds-stat__value--danger':'')+'">'+value+'</div>'+(sub?'<div class="ds-muted ds-xs">'+sub+'</div>':'')+'</div>'; }
function dueText(dueDate){
  const d = daysUntil(dueDate);
  if(d===null) return { text:'No due date', tone:'neutral' };
  if(d<0) return { text:'Overdue by '+plural(-d,'day'), tone:'danger' };
  if(d===0) return { text:'Due today', tone:'danger' };
  return { text:'Due in '+plural(d,'day'), tone:d<=2?'warning':'neutral' };
}
function fundingGapBanner(j){
  const g = fundingGap(j);
  if(!g) return '';
  return '<div class="ds-alert ds-alert--warning ds-alert--enter" role="alert" id="funding-gap">'+icon('wallet')+'<div><strong>Short on client funds</strong>'+esc(g.text)+(g.storageText?' '+esc(g.storageText):'')+
    (canManageFunds() ? '<div class="ds-alert__actions"><button class="ds-btn ds-btn--secondary ds-btn--sm" onclick="openAddFunds(\''+j.id+'\')">'+icon('wallet')+'Add funds received</button></div>' : '')+'</div></div>';
}
function settlementHtml(j, f){
  if(j.statusIndex < 6) return '<p class="ds-muted ds-small">'+icon('info')+' The final balance is worked out after delivery, when every cost is known.</p>';
  const s = f.settlement, pending = j.charges.some(isUnresolved);
  const [tone, ic, title] = s>0 ? ['info','arrow-out','Refund due to client: '+money(s)] : s<0 ? ['warning','receipt','Balance to bill client: '+money(-s)] : ['success','check','Fully settled'];
  return '<div class="ds-alert ds-alert--'+tone+'" id="settlement">'+icon(ic)+'<div><strong>'+esc(title)+(pending?' (provisional)':'')+'</strong>Money in '+money(f.received)+', minus money spent '+money(f.disbursed)+' and our fees '+money(f.ourFees)+'.'+(pending?' Not final: an extra charge still needs a decision.':'')+'</div></div>';
}
function ledgerHtml(j, f){
  const upcoming = j.charges.filter(c=>isReimbursable(c) && !c.paidDate && !isAbsorbed(c)).sort((a,b)=>(parseDMY(a.dueDate)||0)-(parseDMY(b.dueDate)||0));
  if(!f.ledger.length && !upcoming.length) return emptyState('wallet','Nothing recorded yet','Add the client’s deposit to start this job’s notebook.');
  let i = 0;
  const rows = f.ledger.map(r=>{
    const isIn = r.kind==='in';
    const proof = r.evidence ? '<span class="ds-ledger__proof">'+icon('file')+'<span class="ds-mono ds-xs">'+esc(r.evidence)+'</span></span>' : pill(isIn?'Proof missing':'Receipt missing','warning','alert','ds-pill--sm');
    const flag = (!isIn && isUnresolved(r.ref)) ? ' '+pill('Not in quote','warning','alert','ds-pill--sm') : '';
    return '<tr style="--i:'+(i++)+'"><td data-label="Date">'+esc(shortDate(r.date))+'</td><td data-label="What"><span class="ds-ledger__proof">'+icon(isIn?'arrow-in':'arrow-out')+esc(r.label)+flag+'</span></td><td data-label="Proof">'+proof+'</td>'+
      '<td data-label="Money in" class="ds-num'+(isIn?' ds-ledger__in':'')+'">'+(isIn?'+'+money(r.amount):'')+'</td><td data-label="Money spent" class="ds-num">'+(isIn?'':'−'+money(r.amount))+'</td>'+
      '<td data-label="Left over" class="ds-num ds-ledger__bal'+(r.balance<0?' ds-ledger__neg':'')+'">'+moneySigned(r.balance)+'</td></tr>';
  }).join('');
  const coming = upcoming.map(c=>{ const d = dueText(c.dueDate); return '<tr style="--i:'+(i++)+'"><td data-label="Date">'+esc(shortDate(c.dueDate)||'—')+'</td><td data-label="What"><span class="ds-ledger__proof">'+icon('clock')+esc(c.desc)+' <span class="ds-muted">(not paid yet)</span></span></td><td data-label="When">'+pill(d.text,d.tone,'clock','ds-pill--sm')+'</td><td class="ds-num"></td><td data-label="Due" class="ds-num ds-muted">'+money(c.amount)+' due</td><td class="ds-num"></td></tr>'; }).join('');
  return '<div class="ds-table-wrap" style="margin:0 calc(var(--t1m-space-4) * -1)"><table class="ds-table ds-table--stack ds-ledger" id="funds-ledger"><thead><tr><th>Date</th><th>What</th><th>Proof</th><th class="ds-num">Money in</th><th class="ds-num">Money spent</th><th class="ds-num">Left over</th></tr></thead><tbody>'+rows+coming+'</tbody></table></div>';
}
function jobMoneyTab(j){

  const pct = f.received>0 ? Math.min(100, Math.round(f.disbursed/f.received*100)) : (f.disbursed>0?100:0);

    return '<tr><td data-label="Charge" style="white-space:normal"><span class="ds-strong">'+esc(c.desc)+'</span> '+tag+(c.markup?' <span class="ds-muted ds-xs">(+'+money(c.markup)+' markup)</span>':'')+detail+'</td><td data-label="Type">'+(reimb?'Reimbursable':'Service fee')+'<div class="ds-muted ds-xs">'+esc(categoryOf(c))+'</div></td><td data-label="Payment">'+pay+'</td>'+
      '<td data-label="Receipt">'+(c.evidence?'<span class="ds-mono ds-xs">'+esc(c.evidence)+'</span>':(reimb&&c.paidDate?pill('Receipt missing','warning','alert','ds-pill--sm'):'<span class="ds-muted3">—</span>'))+'</td><td data-label="Amount" class="ds-num">'+money(c.amount)+'</td></tr>';
  }).join('');
  const sub = (label, val, strong)=>'<tr><td colspan="4" style="text-align:right'+(strong?';font-weight:600':'')+'">'+label+'</td><td class="ds-num"'+(strong?' style="font-weight:600"':'')+'>'+money(val)+'</td></tr>';
  const maxCat = Math.max(1, ...cm.byCategory.map(c=>c.amount));
  const overQuote = cm.quoted>0 && cm.billed>cm.quoted;
  return '<div class="ds-stack">'+
    (ro ? '<span class="ds-readonly">'+icon('eye')+'Read only for '+esc(role())+'</span>' : '')+
    fundingGapBanner(j)+
    '<section id="client-funds"><div class="ds-section-head"><h2>'+icon('wallet')+'Client money for this job</h2>'+(canManageFunds()?'<button class="ds-btn ds-btn--secondary ds-btn--sm" id="add-funds-btn" onclick="openAddFunds(\''+j.id+'\')">'+icon('plus')+'Add funds received</button>':'')+'</div>'+
      '<p class="ds-muted ds-small" style="margin-bottom:var(--t1m-space-4)">Top1Movers pays duties, freight and port fees for the client first. This notebook shows what the client sent, what we spent for them, and what is left.</p>'+
      '<div class="ds-stats" style="margin-bottom:var(--t1m-space-4)">'+stat('Money in', money(f.received))+stat('Money spent', money(f.disbursed))+stat('Left over', moneySigned(f.balance), f.balance<0, f.balance<0?'Top1Movers has advanced '+money(-f.balance):'')+'</div>'+
      '<div class="ds-stack--sm"><div class="ds-row--between"><span class="ds-label">Spent so far</span><span class="ds-muted ds-xs">'+money(f.disbursed)+' of '+money(f.received)+' received</span></div>'+
      '<span class="ds-bar-track" role="img" aria-label="'+pct+' percent spent" style="display:block;height:8px"><span class="ds-bar-fill ds-bar-fill--'+meterTone+'" style="width:'+pct+'%"></span></span>'+settlementHtml(j, f)+'</div>'+
      '<div style="margin-top:var(--t1m-space-4)">'+ledgerHtml(j, f)+'</div></section>'+
    (unresolved.length ? '<section class="ds-alert ds-alert--warning" id="needs-approval">'+icon('receipt')+'<div style="flex:1"><strong>Extra charge'+(unresolved.length>1?'s':'')+' not in the approved quote</strong>The client did not agree to '+(unresolved.length>1?'these':'this')+' in the quotation. Record the client’s approval, or absorb the cost with a reason. Finance cannot have the job until this is decided.'+

    '<section><div class="ds-section-head"><h2>'+icon('receipt')+'Charges</h2>'+(canManageFunds()?'<button class="ds-btn ds-btn--secondary ds-btn--sm" onclick="openAddCharge(\''+j.id+'\')">'+icon('plus')+'Add charge</button>':'')+'</div>'+
      '<div class="ds-table-wrap" style="margin:0 calc(var(--t1m-space-4) * -1)"><table class="ds-table ds-table--stack" id="charges-table"><thead><tr><th>Charge</th><th>Type</th><th>Payment</th><th>Receipt</th><th class="ds-num">Amount</th></tr></thead><tbody>'+
      (chargeRows||'<tr><td colspan="5" class="ds-muted">No charges recorded yet.</td></tr>')+
      (j.charges.length ? sub('Pass-through costs (billed at cost)', cm.reimbursable)+sub('Our service fees', cm.serviceFees)+(cm.markup?sub('Markup', cm.markup):'')+(cm.absorbedCost?sub('Absorbed by Top1Movers (not billed)', cm.absorbedCost):'')+sub('Total billed to client', cm.billed, true) : '')+'</tbody></table></div></section>'+
    '<section id="cost-margin"><div class="ds-section-head"><h2>'+icon('chart')+'Cost and margin</h2>'+pill(overQuote?'Over the quote':'Within the quote', overQuote?'warning':'success', overQuote?'alert':'check')+'</div>'+
      '<div class="ds-stats" style="margin-bottom:var(--t1m-space-4)">'+stat('Quoted', money(cm.quoted), false, cm.hasQuotation?'':'estimated (no quote in sample data)')+stat('Billed to client', money(cm.billed))+stat('Our margin', moneySigned(cm.margin), cm.margin<0, cm.marginPct.toFixed(1)+'% of billed'+(cm.absorbedCost?' · after '+money(cm.absorbedCost)+' absorbed':''))+'</div>'+

    (j.statusIndex<6 ? '<p class="ds-muted ds-small">'+icon('info')+' The handoff checklist for Finance appears once the goods are delivered.</p>' :
    '<section id="billing-checklist-panel"><div class="ds-section-head"><h2>'+icon('tasks')+'Handoff to Finance</h2>'+(j.statusIndex>=7?pill('With Finance','brand','receipt'):pill(ready?'Ready':'Not ready', ready?'success':'neutral', ready?'check':'clock'))+'</div>'+
      '<ul class="ds-gate" id="billing-checklist">'+checklist.map(c=>gateItemHtml({ label:c.label, sub:c.ok?null:c.sub, met:c.ok, act:c.ok?null:{ label:'Open', js:"goTab('"+j.id+"','"+c.tab+"')" } })).join('')+'</ul>'+
      '<div class="ds-row" style="margin-top:var(--t1m-space-4)">'+
        (j.statusIndex===6 && ready && canManageFunds() ? '<button class="ds-btn ds-btn--secondary" onclick="markBillingReady(\''+j.id+'\')">'+icon('receipt')+'Mark ready for Finance</button>' : '')+
        (j.statusIndex>=7 ? '<a class="ds-btn ds-btn--secondary" href="#/jobs/'+j.id+'/billing-summary">'+icon('file')+'Open Billing Summary</a>' : '')+

    '<p class="ds-muted ds-xs">'+icon('info')+' A per-job notebook for a cleaner Finance handoff, not accounting software: no ledger, tax or payment system behind it. Sample figures.</p>'+
  '</div>';
}

function denyFunds(){ if(canManageFunds()) return false; showToast('Only a Manager or Admin can change client money and charges.', 'danger', 'lock'); return true; }
function openAddFunds(jobId){
  if(denyFunds()) return;
  const j = jobById(jobId), g = fundingGap(j);
  openDrawer({ title:'Add funds received', sub:'<span class="ds-mono">'+j.id+'</span> · a deposit from '+esc(custById(j.customerId).name),

      '<div class="ds-field"><label for="fd-amount">Amount</label><div class="ds-input-group"><span class="ds-affix">PHP</span><input class="ds-input" id="fd-amount" name="amount" type="number" step="0.01" min="0" placeholder="0.00"'+(g?' value="'+Math.ceil(g.short)+'"':'')+'></div>'+errorSlot('amount')+'</div>'+
      '<div class="ds-grid-2" style="gap:var(--t1m-space-3)"><div class="ds-field"><label for="fd-date">Date received</label><input class="ds-input" type="date" id="fd-date" name="date" value="'+dmyToISO(todayDMY())+'">'+errorSlot('date')+'</div>'+
      '<div class="ds-field"><label for="fd-method">Method</label>'+selectWrap('<select class="ds-select" id="fd-method" name="method">'+options(['Bank transfer','Online banking','Check','Cash deposit'])+'</select>')+'</div></div>'+
      '<div class="ds-field"><label for="fd-ref">Bank reference <span class="ds-opt">optional</span></label><input class="ds-input" id="fd-ref" name="reference" placeholder="e.g. BT-781200"></div>'+
      '<div class="ds-field"><label>Deposit slip</label>'+uploadHtml('fundsProof','Deposit slip or bank confirmation')+'</div></form>',
    foot: drawerFoot('Save deposit','funds-form',{icon:'wallet'}) });
}
function saveFunds(jobId, form){
  if(denyFunds()) return;
  const j = jobById(jobId), fd = new FormData(form);
  const amount = Number(fd.get('amount')), date = isoToDMY(fd.get('date'));
  if(fieldError(form,'date', date?'':'Pick the date the money was received.') | fieldError(form,'amount', amount>0?'':'Enter an amount greater than zero.')) return;
  const ref = String(fd.get('reference')||'').trim();
  j.fundsReceived.push({ id:'F'+(j.fundsReceived.length+1), date, amount, method:fd.get('method'), reference:ref, evidence:UPLOADS.fundsProof||null, forDuty:awaitingClientDuty(j) });
  log(j, 'Funds received', money(amount)+' by '+String(fd.get('method')).toLowerCase()+(ref?' (ref '+ref+')':'')+'.', true);
  closeDrawer(); STATE.justNext = j.id;
  showToast(money(amount)+' added. '+(fundingGap(j)?'Still short.':'The job is covered.'), 'success', 'wallet'); render();
}
function openDecideCharge(jobId, chargeId){
  if(denyFunds()) return;
  const j = jobById(jobId), c = j.charges.find(x=>x.id===chargeId), cust = custById(j.customerId);
  openDrawer({ title:'Decide an extra charge', sub:esc(c.desc)+' · '+money(c.amount)+' · <span class="ds-mono">'+j.id+'</span>',
    body:'<form class="ds-stack--sm" id="decide-form" onsubmit="event.preventDefault(); saveDecideCharge(\''+jobId+'\',\''+chargeId+'\', this)">'+
      '<p>This cost was not in the quotation the client signed. Who pays it?</p>'+
      '<label class="ds-check" style="align-items:flex-start"><input type="radio" name="d" value="client" checked onchange="document.getElementById(\'dc-client\').hidden=false; document.getElementById(\'dc-absorb\').hidden=true"> <span><strong class="ds-strong">The client agreed to pay it</strong><br><span class="ds-muted ds-xs">It is billed to the client like any other cost</span></span></label>'+
      '<div id="dc-client" class="ds-field" style="margin-left:26px"><label for="dc-who">Who at the client approved it?</label><input class="ds-input" id="dc-who" name="who" value="'+esc(cust.contact.name)+'">'+errorSlot('who')+'</div>'+
      '<label class="ds-check" style="align-items:flex-start"><input type="radio" name="d" value="absorb" onchange="document.getElementById(\'dc-client\').hidden=true; document.getElementById(\'dc-absorb\').hidden=false"> <span><strong class="ds-strong">Top1Movers absorbs it</strong><br><span class="ds-muted ds-xs">Not billed. It comes out of our margin</span></span></label>'+
      '<div id="dc-absorb" class="ds-field" style="margin-left:26px" hidden><label for="dc-reason">Why are we absorbing it?</label><textarea class="ds-textarea" id="dc-reason" name="reason" placeholder="e.g. Our late lodgement caused the storage days"></textarea>'+errorSlot('reason')+'</div></form>',
    foot: drawerFoot('Save decision','decide-form',{icon:'check'}) });
}
function saveDecideCharge(jobId, chargeId, form){
  if(denyFunds()) return;
  const j = jobById(jobId), c = j.charges.find(x=>x.id===chargeId), fd = new FormData(form);
  if(fd.get('d')==='client'){
    const who = String(fd.get('who')||'').trim();
    if(fieldError(form,'who', who?'':'Name the person at the client who approved it.')) return;
    c.approval = { status:'Client approved', by:CURRENT_USER.name, on:todayDMY(), clientContact:who };
    log(j, 'Extra charge approved by client', c.desc+' ('+money(c.amount)+') approved by '+who+'.', true);
    showToast(c.desc+' marked client approved.', 'success', 'check');
  } else {
    const reason = String(fd.get('reason')||'').trim();
    if(fieldError(form,'reason', reason?'':'A reason is required to absorb a cost.')) return;
    c.approval = { status:'Absorbed', by:CURRENT_USER.name, on:todayDMY(), reason };
    log(j, 'Extra charge absorbed', c.desc+' ('+money(c.amount)+') absorbed by Top1Movers: '+reason, true);
    showToast(c.desc+' absorbed by Top1Movers.', 'info', 'shield');
  }
  closeDrawer(); STATE.justNext = j.id; render();
}
function openAddCharge(jobId){
  if(denyFunds()) return;
  const j = jobById(jobId);
  openDrawer({ title:'Add charge', sub:'<span class="ds-mono">'+j.id+'</span>',

      '<div class="ds-field"><label for="ch-quoted">In the approved quotation?</label>'+selectWrap('<select class="ds-select" id="ch-quoted" name="quoted">'+options([{value:'yes',label:'Yes'},{value:'no',label:'No, needs a decision'}])+'</select>')+'</div>'+
      '<div class="ds-grid-2" style="gap:var(--t1m-space-3)"><div class="ds-field"><label for="ch-paid">Payment</label>'+selectWrap('<select class="ds-select" id="ch-paid" name="paid">'+options([{value:'paid',label:'Already paid'},{value:'unpaid',label:'Not paid yet'}])+'</select>')+'</div>'+
      '<div class="ds-field"><label for="ch-date">Date paid or due</label><input class="ds-input" type="date" id="ch-date" name="date" value="'+dmyToISO(todayDMY())+'">'+errorSlot('date')+'</div></div>'+
      '<div class="ds-field"><label>Receipt</label>'+uploadHtml('chargeEvidence')+'</div></form>',
    foot: drawerFoot('Add charge','charge-form',{icon:'plus'}) });
}
function saveCharge(jobId, form){
  if(denyFunds()) return;
  const j = jobById(jobId), fd = new FormData(form);
  const type = fd.get('type'), amount = Number(fd.get('amount'))||0, reimb = type!=='Service fee', date = isoToDMY(fd.get('date')), desc = String(fd.get('desc')||'').trim();
  if(fieldError(form,'desc', desc?'':'Describe the charge.') | fieldError(form,'amount', amount>0?'':'Enter an amount greater than zero.') | fieldError(form,'date', (!reimb||date)?'':'Pick the date it was paid or is due.')) return;
  const paid = reimb && fd.get('paid')==='paid';
  const c = { id:'C'+(j.charges.length+1), desc, category:fd.get('category'), amount, type, quoted:fd.get('quoted')==='yes', paidDate: paid?date:null, dueDate:(reimb&&!paid)?date:null, evidence:UPLOADS.chargeEvidence||null };
  j.charges.push(c);
  log(j, 'Charge recorded', desc+' ('+money(amount)+', '+type.toLowerCase()+(c.quoted?'':', not in quotation')+').', true);
  closeDrawer(); STATE.justNext = j.id; showToast('Charge added.', 'success', 'check'); render();
}
function markBillingReady(jobId){
  if(denyFunds()) return;
  const j = jobById(jobId);
  const missing = billingChecklist(j).filter(c=>!c.ok);
  if(missing.length){ showToast('Not ready: '+missing[0].label.toLowerCase()+'.', 'danger', 'lock'); return; }
  j.statusIndex = 7; j.billingReadyDays = 0;
  log(j, 'Ready for Finance', 'Billing checklist complete. Handed to Finance.');
  STATE.justAdvanced = { id:j.id, idx:7 }; STATE.justNext = j.id;
  showToast(j.id+' is with Finance now.', 'success', 'receipt'); render();
}

      '<div class="ds-billing-summary__grid"><div><span class="ds-label">Customer</span><div class="ds-strong">'+esc(c.name)+'</div><div class="ds-muted ds-small">'+esc(j.consignee)+'</div></div><div><span class="ds-label">Shipment</span><div>'+esc(j.origin+' → '+j.portOfEntry+' → '+j.destination)+'</div><div class="ds-muted ds-small">Container '+esc(j.containerNo)+' · BL '+esc(j.blNo)+'</div></div></div>'+

/* ============================== INQUIRIES & QUOTES ==============================
   The commercial half of the workflow lives on ONE page per inquiry: the request, its quotation
   versions, the client's approval (conforme) and the job it becomes. The same "next step" panel
   as a shipment job tells the dispatcher what is missing before it can become a job. */
function inquiryStage(i){
  if(i.status==='Declined') return { key:'Declined', label:'Declined', tone:'neutral', icon:'x', next:'Declined' };
  if(i.status==='Converted') return { key:'Converted', label:'Converted to job', tone:'success', icon:'check', next:'Done' };
  const q = i.quotationId ? QUOTATIONS[i.quotationId] : null;
  if(q && q.conforme) return { key:'Approved', label:'Client approved', tone:'brand', icon:'check', next: inquiryMissing(i).length ? 'Fill missing details, then convert' : 'Convert to a shipment job' };
  if(q) return { key:'Quoted', label:'Waiting on client', tone:'warning', icon:'clock', next:'Record the client’s approval' };
  return { key:'New', label:'Needs a quote', tone:'info', icon:'quote', next:'Create a quotation' };
}
function inquiryPill(i){ const s = inquiryStage(i); return pill(s.label, s.tone, s.icon); }
function linkedJob(i){ return i.quotationId ? JOBS.find(j=>j.quotationId===i.quotationId) : null; }
function renderInquiries(){
  const f = STATE.inqFilter;
  const keys = ['New','Quoted','Approved'];
  const match = i=>{ const k = inquiryStage(i).key; return f==='open' ? keys.includes(k) : f==='all' ? true : k===f; };
  const cnt = k => INQUIRIES.filter(i=> k==='open' ? keys.includes(inquiryStage(i).key) : k==='all' ? true : inquiryStage(i).key===k).length;
  const chip = (k,l)=>'<button class="ds-chip" aria-pressed="'+(f===k)+'" onclick="STATE.inqFilter=\''+k+'\'; render()">'+l+'<span class="ds-chip__count">'+cnt(k)+'</span></button>';
  const rows = INQUIRIES.filter(match).slice().reverse().map(i=>{
    const c = custById(i.customerId), st = inquiryStage(i), miss = inquiryMissing(i);
    return '<tr data-href onclick="go(\'#/inquiries/'+i.id+'\')"><td data-label="Inquiry"><span class="ds-cell-name"><span class="ds-mono ds-cell-primary">'+i.id+'</span><span class="ds-cell-sub">received '+shortDate(i.dateReceived)+'</span></span></td>'+
      '<td data-label="Customer"><span class="ds-cell-name">'+esc(c.name)+'<span class="ds-cell-sub">'+esc(i.cargo)+'</span></span></td>'+
      '<td data-label="Route">'+esc(i.origin.split(',')[0]+' → '+i.destination.split(',')[0])+'</td>'+
      '<td data-label="Stage">'+inquiryPill(i)+(miss.length && !['Declined','Converted'].includes(st.key)?' '+pill(miss.length+' missing','warning','alert','ds-pill--sm'):'')+'</td>'+
      '<td data-label="Next step" style="white-space:normal"><span class="ds-strong">'+esc(st.next)+'</span></td><td data-label="Owner">'+esc(i.assignedTo)+'</td></tr>';
  }).join('');
  const flow = ['Inquiry','Quotation','Client approval','Shipment job'].map((s,k)=>'<span class="ds-row ds-row--tight"><span class="ds-scenario__n" style="width:24px;height:24px;font-size:var(--t1m-text-xs)">'+(k+1)+'</span>'+s+'</span>').join(icon('arrow-right','ds-muted3'));
  return '<div class="ds-page-head"><div><h1>Inquiries &amp; quotes</h1><p class="ds-page-head__sub">Winning the work. A client asks, we quote, the client signs the quote (the conforme), and it becomes a shipment job without retyping anything.</p></div>'+
    '<div class="ds-page-head__actions"><button class="ds-btn ds-btn--primary" id="new-inquiry" onclick="openNewInquiry()">'+icon('plus')+'New inquiry</button></div></div>'+
    '<section class="ds-panel ds-panel--elevated"><div class="ds-panel__body ds-stack--sm"><div class="ds-row ds-small ds-muted" aria-label="Sales flow">'+flow+'</div>'+
      '<div class="ds-chips ds-chips--scroll">'+chip('open','Open')+chip('New','Needs a quote')+chip('Quoted','Waiting on client')+chip('Approved','Ready to convert')+chip('Converted','Converted')+chip('Declined','Declined')+chip('all','All')+'</div></div>'+

function dealNext(i){
  const q = i.quotationId ? QUOTATIONS[i.quotationId] : null, miss = inquiryMissing(i), job = linkedJob(i);
  if(i.status==='Converted' && job) return { tone:'done', icon:'check', eyebrow:'Done', title:'Converted to '+job.id, text:'The job carries every detail from this inquiry and its approved quotation. Operations takes it from here.', items:[], primary:act('Open '+job.id,"go('#/jobs/"+job.id+"')",'arrow-right') };
  if(i.status==='Declined') return { tone:'done', icon:'x', eyebrow:'Closed', title:'Inquiry declined', text:i.declineReason||'No quotation will be made.', items:[], primary:null };
  const items = [
    { label:'Shipment details complete', sub: miss.length ? 'Missing: '+miss.join(', ') : 'Cargo, route, container, pickup date and delivery address', met:!miss.length, act: miss.length ? act('Fill in',"openEditInquiry('"+i.id+"')",'plus') : null },
    { label:'Quotation sent', sub: q ? q.id+' v'+q.versions[q.versions.length-1].v+' · '+money(q.versions[q.versions.length-1].total) : 'Price the request', met:!!q, act: q ? null : act('Create quotation',"openCreateQuote('"+i.id+"')",'quote') },
    { label:'Client approval recorded (conforme)', sub: q && q.conforme ? q.conforme.approvedBy+' · '+q.conforme.date : 'The client signs the quotation to accept it', met:!!(q && q.conforme), act: q && !q.conforme ? act('Record approval',"openConforme('"+q.id+"')",'check') : null }
  ];
  const unmet = items.filter(x=>!x.met);
  if(!unmet.length) return { tone:'ready', icon:'box', eyebrow:'Next step', title:'Create the shipment job', text:'Everything is agreed. One click opens the job with all details carried over, the five documents set as missing and the task list in place.', items, gateTitle:'Ready to become a job', primary:act('Create shipment job',"openConvert('"+i.id+"')",'box') };
  const first = unmet.find(x=>x.act);
  const waiting = unmet.length===1 && !miss.length && q && !q.conforme;
  return { tone: waiting ? 'waiting' : 'ready', icon: waiting ? 'clock' : 'flag', eyebrow: waiting ? 'Waiting on the client' : 'To become a shipment job',
    title: waiting ? 'Client to sign quotation '+q.id : plural(unmet.length,'thing')+' left before this can become a job',
    text: waiting ? 'Once '+custById(i.customerId).contact.name+' signs the conforme, record it here.' : 'You can price a request before every detail is known, but a job cannot run without them.',
    items, gateTitle:'What must be true first', primary: first ? first.act : null };
}

function saveQuote(inqId, qid, form){
  const fd = new FormData(form), total = Number(fd.get('total')), notes = String(fd.get('notes')||'').trim();
  if(fieldError(form,'total', total>0?'':'Enter the quoted total.')) return;
  if(qid){
    if(fieldError(form,'notes', notes?'':'Say what changed, so the history makes sense later.')) return;
    const q = QUOTATIONS[qid], last = q.versions[q.versions.length-1];
    q.versions.push({ v:last.v+1, date:todayDMY(), total, terms:String(fd.get('terms')||''), notes });
    closeDrawer(); showToast(q.id+' v'+(last.v+1)+' saved. Earlier versions are kept.', 'success', 'quote'); render(); return;
  }
  const i = INQUIRIES.find(x=>x.id===inqId);
  const id = 'QT-2026-00'+(41+Object.keys(QUOTATIONS).length+1);
  QUOTATIONS[id] = { id, inquiryId:inqId, versions:[{ v:1, date:todayDMY(), total, terms:String(fd.get('terms')||''), notes:notes||'Initial quotation.' }], conforme:null };
  i.quotationId = id; i.status = 'Quoted';
  closeDrawer(); showToast('Quotation '+id+' v1 created: '+money(total)+'.', 'success', 'quote'); render();
}

function normName(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\b(inc|corp|co|ltd|corporation|company|the)\b/g,'').replace(/\s+/g,' ').trim(); }
function renderCustomers(){
  const q = STATE.customerQuery.trim().toLowerCase();
  const rows = CUSTOMERS.filter(c=>!q || (c.name+' '+c.contact.name+' '+c.city).toLowerCase().includes(q)).map(c=>{
    const jobs = JOBS.filter(j=>j.customerId===c.id && j.statusIndex<8), inq = INQUIRIES.filter(i=>i.customerId===c.id && ['New','Quoted','Approved'].includes(inquiryStage(i).key));
    const att = jobs.filter(j=>['danger','warning'].includes(jobHealth(j).tone)).length;
    return '<tr data-href onclick="go(\'#/customers/'+c.id+'\')"><td data-label="Customer"><span class="ds-cell-name"><span class="ds-cell-primary">'+esc(c.name)+'</span><span class="ds-cell-sub">'+esc(c.city)+'</span></span></td>'+
      '<td data-label="Contact">'+esc(c.contact.name)+'</td><td data-label="Coordinator">'+esc(coordinatorFor(c.id))+'</td>'+
      '<td data-label="Active jobs" class="ds-num">'+jobs.length+(att?' '+pill(att+' need attention','warning','alert','ds-pill--sm'):'')+'</td><td data-label="Open inquiries" class="ds-num">'+inq.length+'</td></tr>';
  }).join('');
  return '<div class="ds-page-head"><div><h1>Customers</h1><p class="ds-page-head__sub">One reference for every client: contacts, consignees, delivery instructions and their full history.</p></div>'+
    '<div class="ds-page-head__actions"><button class="ds-btn ds-btn--primary" onclick="openNewCustomer()">'+icon('plus')+'New customer</button></div></div>'+
    '<section class="ds-panel ds-panel--elevated"><div class="ds-panel__body"><div class="ds-search" style="max-width:420px">'+icon('search')+'<input class="ds-input" id="customer-search" placeholder="Name, contact or city" value="'+esc(STATE.customerQuery)+'" oninput="STATE.customerQuery=this.value; render()"></div></div>'+
    '<div class="ds-table-wrap"><table class="ds-table ds-table--stack"><thead><tr><th>Customer</th><th>Contact</th><th>Coordinator</th><th class="ds-num">Active jobs</th><th class="ds-num">Open inquiries</th></tr></thead><tbody>'+
    (rows||'<tr><td colspan="5">'+emptyState('search','No customers match','Try part of the name, or add them as a new customer.')+'</td></tr>')+'</tbody></table></div></section>';
}
function openNewCustomer(fromInquiry){
  openDrawer({ title:'New customer', sub:'Company name, phone and email are required. Everything else can be added later.',
    body:'<form class="ds-stack--sm" id="cust-form" novalidate onsubmit="event.preventDefault(); saveCustomer(this, '+(fromInquiry?'true':'false')+')">'+
      '<div class="ds-field"><label for="nc-name">Company name</label><input class="ds-input" id="nc-name" name="name" placeholder="e.g. Test Freight Co." oninput="checkDuplicate(this.value)" autocomplete="off">'+errorSlot('name')+'</div><div id="nc-dup"></div>'+
      '<div class="ds-field"><label for="nc-contact">Contact person</label><input class="ds-input" id="nc-contact" name="contact"></div>'+
      '<div class="ds-grid-2" style="gap:var(--t1m-space-3)"><div class="ds-field"><label for="nc-phone">Phone</label><input class="ds-input" id="nc-phone" name="phone" type="tel" placeholder="e.g. +63 917 555 0123">'+errorSlot('phone')+'</div><div class="ds-field"><label for="nc-email">Email</label><input class="ds-input" id="nc-email" name="email" type="email" placeholder="e.g. ops@testfreight.ph">'+errorSlot('email')+'</div></div>'+
      '<div class="ds-field"><label for="nc-city">City</label><input class="ds-input" id="nc-city" name="city" placeholder="e.g. Pasig, PH"></div>'+
      '<div class="ds-field"><label for="nc-addr">Delivery address</label><input class="ds-input" id="nc-addr" name="address"></div>'+
      '<div class="ds-field"><label for="nc-instr">Delivery instructions <span class="ds-opt">shown to the crew on every delivery</span></label><textarea class="ds-textarea" id="nc-instr" name="instructions" style="min-height:64px" placeholder="e.g. Call the dock 30 minutes before arrival"></textarea></div></form>',
    foot: drawerFoot('Save customer','cust-form',{icon:'check'}) });
}
function checkDuplicate(v){
  const n = normName(v);
  const m = n.length>=3 ? CUSTOMERS.find(c=>normName(c.name)===n || normName(c.name).startsWith(n) || n.startsWith(normName(c.name))) : null;
  document.getElementById('nc-dup').innerHTML = m ? '<div class="ds-alert ds-alert--warning" id="dup-warning">'+icon('alert')+'<div><strong>Possible duplicate</strong>“'+esc(m.name)+'” already exists. Check it is not the same company before adding another record.<div class="ds-alert__actions"><button type="button" class="ds-btn ds-btn--secondary ds-btn--sm" onclick="closeDrawer(); go(\'#/customers/'+m.id+'\')">Open '+esc(m.name)+'</button></div></div></div>' : '';
}
function saveCustomer(form, fromInquiry){
  const fd = new FormData(form), v = k=>String(fd.get(k)||'').trim();
  const nameBad = fieldError(form,'name', v('name')?'':'Enter the company name.');
  const phoneBad = fieldError(form,'phone', !v('phone') ? 'Enter the contact phone number.' : /^\+?[\d\s()-]{7,}$/.test(v('phone')) ? '' : 'Enter a valid phone number, e.g. +63 917 555 0123.');
  const emailBad = fieldError(form,'email', !v('email') ? 'Enter the contact email.' : /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('email')) ? '' : 'Enter a valid email, e.g. ops@company.ph.');
  if(nameBad || phoneBad || emailBad) return;
  const addr = v('address')||'—', id = 'CUST-0'+(CUSTOMERS.length+1);
  CUSTOMERS.push({ id, name:v('name'), city:v('city')||'—', contact:{ name:v('contact')||'—', email:v('email'), phone:v('phone') }, consignees:[{ name:v('name')+' — Main', address:addr }], deliveryAddresses:[addr], requirements:'None recorded.', instructions:v('instructions')||'None recorded.' });
  DISPATCHER_FOR_CUSTOMER[id] = isDispatcher() ? CURRENT_USER.name : 'Ana Cruz';
  closeDrawer(); showToast(v('name')+' saved.', 'success', 'check');
  if(fromInquiry){ openNewInquiry(id); return; }
  go('#/customers/'+id);
}

  if(!c) return '<div class="ds-panel ds-panel--elevated">'+emptyState('search','Customer not found','','<a class="ds-btn ds-btn--secondary" href="#/customers">All customers</a>')+'</div>';
  const jobs = JOBS.filter(j=>j.customerId===id), inqs = INQUIRIES.filter(i=>i.customerId===id);
  const f = (k,v)=>'<dt>'+esc(k)+'</dt><dd>'+v+'</dd>';
  return '<nav class="ds-crumbs"><a href="#/customers">Customers</a>'+icon('chevron-right')+'<span>'+esc(c.name)+'</span></nav>'+
    '<div class="ds-page-head"><div><h1>'+esc(c.name)+'</h1><p class="ds-page-head__sub">'+esc(c.city)+' · coordinator '+esc(coordinatorFor(id))+'</p></div><div class="ds-page-head__actions"><button class="ds-btn ds-btn--primary" id="cust-new-inquiry" onclick="openNewInquiry(\''+id+'\')">'+icon('plus')+'New inquiry</button></div></div>'+
    '<div class="ds-split"><div class="ds-stack">'+
      '<section class="ds-panel ds-panel--elevated"><div class="ds-panel__head"><h2>'+icon('box')+'Shipments</h2><span class="ds-panel__hint">'+plural(jobs.length,'job')+'</span></div>'+
        (jobs.length ? '<div class="ds-table-wrap"><table class="ds-table ds-table--stack"><thead><tr><th>Job</th><th>Stage</th><th>Health</th><th>Next step</th></tr></thead><tbody>'+jobs.map(j=>'<tr data-href onclick="go(\'#/jobs/'+j.id+'\')"><td data-label="Job"><span class="ds-mono ds-cell-primary">'+j.id+'</span></td><td data-label="Stage">'+stagePill(j)+'</td><td data-label="Health">'+healthPill(j)+'</td><td data-label="Next step" style="white-space:normal">'+esc(nextStep(j).short)+'</td></tr>').join('')+'</tbody></table></div>'
          : '<div class="ds-panel__body ds-muted">No shipments yet.</div>')+'</section>'+
      '<section class="ds-panel ds-panel--elevated"><div class="ds-panel__head"><h2>'+icon('quote')+'Inquiries &amp; quotes</h2></div>'+
        (inqs.length ? '<div class="ds-table-wrap"><table class="ds-table ds-table--stack"><thead><tr><th>Inquiry</th><th>Cargo</th><th>Stage</th></tr></thead><tbody>'+inqs.map(i=>'<tr data-href onclick="go(\'#/inquiries/'+i.id+'\')"><td data-label="Inquiry"><span class="ds-mono ds-cell-primary">'+i.id+'</span></td><td data-label="Cargo">'+esc(i.cargo)+'</td><td data-label="Stage">'+inquiryPill(i)+'</td></tr>').join('')+'</tbody></table></div>'
          : '<div class="ds-panel__body ds-muted">No inquiries yet.</div>')+'</section>'+
    '</div><div class="ds-stack">'+
      '<section class="ds-panel ds-panel--elevated"><div class="ds-panel__head"><h3>'+icon('user')+'Contact</h3></div><div class="ds-panel__body"><dl class="ds-facts">'+f('Name',esc(c.contact.name))+f('Email',esc(c.contact.email))+f('Phone',esc(c.contact.phone))+'</dl></div></section>'+
      '<div class="ds-alert ds-alert--info">'+icon('truck')+'<div><strong>Delivery instructions</strong>'+esc(c.instructions)+'<div class="ds-muted ds-xs" style="margin-top:4px">Shown to the crew on every delivery for this customer.</div></div></div>'+
      '<div class="ds-alert ds-alert--info">'+icon('info')+'<div><strong>Requirements</strong>'+esc(c.requirements)+'</div></div>'+
      '<section class="ds-panel ds-panel--elevated"><div class="ds-panel__head"><h3>'+icon('pin')+'Consignees &amp; addresses</h3></div><div class="ds-panel__body ds-stack--sm">'+c.consignees.map(x=>'<div><div class="ds-strong">'+esc(x.name)+'</div><div class="ds-muted ds-small">'+esc(x.address)+'</div></div>').join('')+c.deliveryAddresses.map(a=>'<div class="ds-muted ds-small">'+icon('pin')+' '+esc(a)+'</div>').join('')+'</div></section>'+

}
